<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบสต๊อกชา & เติมวัตถุดิบ</title>
  <meta property="og:title" content="ระบบสต๊อกชา & เติมวัตถุดิบ" />
  <meta property="og:description" content="ระบบจัดการสต๊อก คำนวณการต้มชา และเติมวัตถุดิบประจำวัน" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
    
    .custom-input {
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
      transition: all 0.2s ease-in-out;
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      outline: none;
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyD3wBGAwKShNdgQ9koIOc012Rr7G3PThaQ",
      authDomain: "mystock-9c662.firebaseapp.com",
      projectId: "mystock-9c662",
      storageBucket: "mystock-9c662.firebasestorage.app",
      messagingSenderId: "260845867642",
      appId: "1:260845867642:web:838b08a93178e8d2eae1c3",
      measurementId: "G-J37RQGYDT2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 🟢 ระบบ Offline Persistence เร่งความเร็วข้อมูล
    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      if (err.code === 'failed-precondition') {
        console.log('Offline Persistence: มีการเปิดเว็บหลายแท็บพร้อมกัน');
      } else if (err.code === 'unimplemented') {
        console.log('Offline Persistence: เบราว์เซอร์ไม่รองรับ');
      }
    });

    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=150';

    // ==========================================
    // 1. MODAL: เพิ่ม/แก้ไข วัตถุดิบ (Stock Modal)
    // ==========================================
    function StockModal({ isOpen, onClose, onSave, editingStock }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('ชา/กาแฟ');
      const [current, setCurrent] = useState('');
      const [unit, setUnit] = useState('กรัม');
      const [minAlert, setMinAlert] = useState('500');
      const [pricePerUnit, setPricePerUnit] = useState('');

      useEffect(() => {
        if (editingStock) {
          setName(editingStock.name || '');
          setCategory(editingStock.category || 'ชา/กาแฟ');
          setCurrent(editingStock.current || '');
          setUnit(editingStock.unit || 'กรัม');
          setMinAlert(editingStock.minAlert || '500');
          setPricePerUnit(editingStock.pricePerUnit || '');
        } else {
          setName('');
          setCategory('ชา/กาแฟ');
          setCurrent('');
          setUnit('กรัม');
          setMinAlert('500');
          setPricePerUnit('');
        }
      }, [editingStock, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || current === '') return alert('กรุณากรอกชื่อวัตถุดิบและจำนวนคงเหลือ');
        onSave({
          id: editingStock ? editingStock.id : undefined,
          name,
          category,
          current: Number(current),
          unit,
          minAlert: Number(minAlert),
          pricePerUnit: pricePerUnit ? Number(pricePerUnit) : 0
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <i data-lucide={editingStock ? "edit-3" : "plus-circle"} className="w-5 h-5 text-emerald-600"></i>
                {editingStock ? 'แก้ไขรายการวัตถุดิบ' : 'เพิ่มวัตถุดิบใหม่เข้าระบบ'}
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อวัตถุดิบ <span className="text-rose-500">*</span></label>
                <input type="text" placeholder="เช่น ผงชาไทยตรามือ" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">หมวดหมู่</label>
                  <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-2.5 text-sm rounded-xl custom-input">
                    <option value="ชา/กาแฟ">ชา / กาแฟ</option>
                    <option value="นม/น้ำตาล">นม / น้ำตาล / สารให้ความหวาน</option>
                    <option value="ท็อปปิ้ง">ท็อปปิ้ง / ไข่มุก</option>
                    <option value="บรรจุภัณฑ์">บรรจุภัณฑ์ / แก้ว / หลอด</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">หน่วยเรียก <span className="text-rose-500">*</span></label>
                  <input type="text" placeholder="เช่น กรัม, มล., ซอง" value={unit} onChange={e => setUnit(e.target.value)} required className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวนปัจจุบัน <span className="text-rose-500">*</span></label>
                  <input type="number" step="any" placeholder="0" value={current} onChange={e => setCurrent(e.target.value)} required className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">จุดเตือนสั่งเพิ่ม (Min Alert)</label>
                  <input type="number" step="any" placeholder="500" value={minAlert} onChange={e => setMinAlert(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">ราคาต่อหน่วย (บาท) - ถ้ามี</label>
                <input type="number" step="any" placeholder="เช่น 0.25" value={pricePerUnit} onChange={e => setPricePerUnit(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
              </div>

              <div className="pt-4 flex gap-3">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
                <button type="submit" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition">บันทึกข้อมูล</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. MODAL: เติมวัตถุดิบเข้าคลัง (Restock Batch Modal)
    // ==========================================
    function RestockModal({ isOpen, onClose, stocks, onConfirmBatchRestock }) {
      const [restockQtyMap, setRestockQtyMap] = useState({});
      const [note, setNote] = useState('');

      useEffect(() => {
        if (isOpen) {
          const initialMap = {};
          stocks.forEach(s => { initialMap[s.id] = ''; });
          setRestockQtyMap(initialMap);
          setNote('เติมวัตถุดิบประจำวัน');
        }
      }, [isOpen, stocks]);

      if (!isOpen) return null;

      const handleQtyChange = (stockId, val) => {
        setRestockQtyMap(prev => ({ ...prev, [stockId]: val }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirmBatchRestock(restockQtyMap, note);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                <div>
                  <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i data-lucide="plus-circle" className="w-5 h-5 text-emerald-600"></i>
                    📥 เติมวัตถุดิบเข้าคลัง (Restock Batch)
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5">ใส่จำนวนที่ต้องการเติมลงในช่องของแต่ละวัตถุดิบ</p>
                </div>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form id="restockForm" onSubmit={handleSubmit} className="space-y-4">
                <div className="max-h-[50vh] overflow-y-auto pr-1 space-y-3">
                  {stocks.map(stock => {
                    const isLow = Number(stock.current) <= Number(stock.minAlert || 0);
                    return (
                      <div key={stock.id} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${isLow ? 'bg-rose-50/50 border-rose-200' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-sm text-slate-800 truncate">{stock.name}</span>
                            {isLow && <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded font-bold">ใกล้หมด</span>}
                          </div>
                          <span className="text-xs text-slate-400">ปัจจุบัน: <strong className="text-slate-700">{stock.current}</strong> {stock.unit}</span>
                        </div>
                        <div className="w-36 flex items-center space-x-1.5">
                          <span className="text-xs font-bold text-emerald-600">+</span>
                          <input
                            type="number"
                            step="any"
                            placeholder="0"
                            value={restockQtyMap[stock.id] || ''}
                            onChange={(e) => handleQtyChange(stock.id, e.target.value)}
                            className="w-full px-3 py-2 text-sm text-center font-bold text-emerald-700 bg-white rounded-xl border border-slate-300 focus:border-emerald-500 focus:outline-none"
                          />
                          <span className="text-xs text-slate-400 whitespace-nowrap min-w-[30px]">{stock.unit}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="pt-2">
                  <label className="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุการเติมวัตถุดิบ</label>
                  <input
                    type="text"
                    placeholder="เช่น สั่งซื้อจากซัพพลายเออร์ A / ซื้อจากแม็คโคร"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full px-4 py-2.5 text-sm rounded-xl custom-input"
                  />
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-slate-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
              <button type="submit" form="restockForm" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition">บันทึกการเติมสต๊อก</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. MODAL: เพิ่ม/แก้ไข สูตรเครื่องดื่ม (BOM Modal)
    // ==========================================
    function RecipeModal({ isOpen, onClose, onSave, editingRecipe, stocks, handleImageUpload }) {
      const [name, setName] = useState('');
      const [yieldInfo, setYieldInfo] = useState('1 หม้อ (ประมาณ 5 ลิตร)');
      const [image, setImage] = useState('');
      const [ingredients, setIngredients] = useState([]);

      useEffect(() => {
        if (editingRecipe) {
          setName(editingRecipe.name || '');
          setYieldInfo(editingRecipe.yieldInfo || '1 หม้อ');
          setImage(editingRecipe.image || '');
          setIngredients(editingRecipe.ingredients || []);
        } else {
          setName('');
          setYieldInfo('1 หม้อ (ประมาณ 5 ลิตร)');
          setImage('');
          setIngredients([]);
        }
      }, [editingRecipe, isOpen]);

      if (!isOpen) return null;

      const handleAddIngredient = () => {
        if (stocks.length === 0) return alert('กรุณาเพิ่มวัตถุดิบในคลังก่อนสร้างสูตร');
        setIngredients(prev => [...prev, { stockId: stocks[0].id, amount: '' }]);
      };

      const handleRemoveIngredient = (index) => {
        setIngredients(prev => prev.filter((_, i) => i !== index));
      };

      const handleIngredientChange = (index, field, value) => {
        setIngredients(prev => {
          const updated = [...prev];
          updated[index] = { ...updated[index], [field]: value };
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name) return alert('กรุณาระบุชื่อสูตรเครื่องดื่ม');
        if (ingredients.length === 0) return alert('กรุณาเพิ่มส่วนผสมอย่างน้อย 1 รายการ');

        for (let ing of ingredients) {
          if (!ing.stockId || !ing.amount || Number(ing.amount) <= 0) {
            return alert('กรุณากรอกปริมาณส่วนผสมให้ครบถ้วนและถูกต้อง');
          }
        }

        onSave({
          id: editingRecipe ? editingRecipe.id : undefined,
          name,
          yieldInfo,
          image,
          ingredients: ingredients.map(i => ({ stockId: i.stockId, amount: Number(i.amount) }))
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col justify-between">
            <div className="overflow-y-auto pr-1">
              <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
                <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                  <i data-lucide={editingRecipe ? "edit-3" : "book-open"} className="w-5 h-5 text-emerald-600"></i>
                  {editingRecipe ? 'แก้ไขสูตรเครื่องดื่ม' : 'เพิ่มสูตรเครื่องดื่มใหม่ (BOM)'}
                </h3>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form id="recipeForm" onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อสูตร / เครื่องดื่ม <span className="text-rose-500">*</span></label>
                  <input type="text" placeholder="เช่น ชาไทยสูตรต้ม 5 ลิตร" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">ปริมาณที่ได้ต่อ 1 บัตช์ / หม้อ</label>
                  <input type="text" placeholder="เช่น 1 หม้อ (ประมาณ 5 ลิตร / 25 แก้ว)" value={yieldInfo} onChange={e => setYieldInfo(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">รูปภาพประกอบ</label>
                  <div className="flex items-center space-x-3">
                    <img src={image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border border-slate-200" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} className="text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-100">
                  <div className="flex justify-between items-center mb-3">
                    <label className="text-xs font-bold text-slate-700">รายการวัตถุดิบส่วนผสม (ต่อ 1 หม้อ) <span className="text-rose-500">*</span></label>
                    <button type="button" onClick={handleAddIngredient} className="text-xs font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg flex items-center gap-1">
                      <i data-lucide="plus" className="w-3.5 h-3.5"></i> เพิ่มวัตถุดิบ
                    </button>
                  </div>

                  {ingredients.length === 0 ? (
                    <div className="text-center py-6 border-2 border-dashed border-slate-200 rounded-2xl text-xs text-slate-400">
                      ยังไม่มีส่วนผสม กดปุ่ม "+ เพิ่มวัตถุดิบ" ด้านบนเพื่อระบุส่วนผสม
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {ingredients.map((ing, idx) => {
                        const selectedStock = stocks.find(s => s.id === ing.stockId);
                        return (
                          <div key={idx} className="flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                            <select
                              value={ing.stockId}
                              onChange={(e) => handleIngredientChange(idx, 'stockId', e.target.value)}
                              className="flex-1 px-3 py-2 text-xs rounded-lg custom-input"
                            >
                              {stocks.map(s => (
                                <option key={s.id} value={s.id}>{s.name} ({s.unit})</option>
                              ))}
                            </select>

                            <input
                              type="number"
                              step="any"
                              placeholder="จำนวนที่ใช้"
                              value={ing.amount}
                              onChange={(e) => handleIngredientChange(idx, 'amount', e.target.value)}
                              className="w-28 px-3 py-2 text-xs rounded-lg custom-input font-bold text-center"
                            />

                            <span className="text-xs text-slate-500 min-w-[30px] font-medium">{selectedStock ? selectedStock.unit : ''}</span>

                            <button type="button" onClick={() => handleRemoveIngredient(idx)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-slate-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
              <button type="submit" form="recipeForm" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition">บันทึกสูตร</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('production');
      const [stocks, setStocks] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);

      // Search States ในแต่ละส่วน
      const [searchProduction, setSearchProduction] = useState('');
      const [searchStock, setSearchStock] = useState('');
      const [searchRecipe, setSearchRecipe] = useState('');
      const [searchHistory, setSearchHistory] = useState('');

      const [batchQuantities, setBatchQuantities] = useState({});
      const [productionNote, setProductionNote] = useState('');

      // Modals
      const [stockModalOpen, setStockModalOpen] = useState(false);
      const [editingStock, setEditingStock] = useState(null);

      const [restockModalOpen, setRestockModalOpen] = useState(false);

      const [recipeModalOpen, setRecipeModalOpen] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // --- Firebase Listener ---
      useEffect(() => {
        const unsubStocks = db.collection('stocks').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setStocks(data);
          setLoading(false);
        }, err => console.error("Error stocks:", err));

        const unsubRecipes = db.collection('recipes').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setRecipes(data);
        }, err => console.error("Error recipes:", err));

        const unsubLogs = db.collection('logs').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return {
              id: doc.id,
              ...docData,
              createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now()
            };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setLogs(data);
        }, err => console.error("Error logs:", err));

        return () => {
          unsubStocks();
          unsubRecipes();
          unsubLogs();
        };
      }, []);

      // Filtered Lists ตามการค้นหา
      const filteredProductionRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchProduction.toLowerCase()));
      }, [recipes, searchProduction]);

      const filteredStocks = useMemo(() => {
        return stocks.filter(s => 
          s.name.toLowerCase().includes(searchStock.toLowerCase()) || 
          (s.category && s.category.toLowerCase().includes(searchStock.toLowerCase()))
        );
      }, [stocks, searchStock]);

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchRecipe.toLowerCase()));
      }, [recipes, searchRecipe]);

      const filteredLogs = useMemo(() => {
        return logs.filter(l => 
          (l.title && l.title.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.type && l.type.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.note && l.note.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (Array.isArray(l.details) && l.details.some(d => d.toLowerCase().includes(searchHistory.toLowerCase())))
        );
      }, [logs, searchHistory]);

      // คำนวณหาวัตถุดิบที่เหลือน้อยกว่าจุดเตือนสั่งซื้อ
      const lowStockItems = useMemo(() => {
        return stocks.filter(item => {
          const currentVal = Number(item.current) || 0;
          const minVal = Number(item.minAlert) || 0;
          return currentVal <= minVal;
        });
      }, [stocks]);

      // --- Helper: Image Upload ---
      const handleImageUpload = (e, callback) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 1.2 * 1024 * 1024) {
            alert("รูปภาพมีขนาดใหญ่เกินไป กรุณาใช้รูปขนาดไม่เกิน 1.2MB ครับ");
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => callback(reader.result);
          reader.readAsDataURL(file);
        }
      };

      // --- Handlers: Production ---
      const handleQuantityChange = (recipeId, delta) => {
        setBatchQuantities(prev => {
          const current = prev[recipeId] || 0;
          const updated = Math.max(0, current + delta);
          return { ...prev, [recipeId]: updated };
        });
      };

      const selectedProductionList = useMemo(() => {
        return Object.entries(batchQuantities)
          .filter(([_, qty]) => qty > 0)
          .map(([recipeId, qty]) => {
            const recipe = recipes.find(r => r.id === recipeId);
            return {
              recipeId,
              name: recipe ? recipe.name : 'สูตรเครื่องดื่ม',
              qty,
              yieldInfo: recipe ? recipe.yieldInfo : '',
              recipe
            };
          });
      }, [batchQuantities, recipes]);

      const handleConfirmProduction = async () => {
        if (selectedProductionList.length === 0) return alert('กรุณาเลือกจำนวนหม้ออย่างน้อย 1 รายการ');

        try {
          const batch = db.batch();

          const deductionsSummary = {};
          selectedProductionList.forEach(item => {
            if (item.recipe && item.recipe.ingredients) {
              item.recipe.ingredients.forEach(ing => {
                deductionsSummary[ing.stockId] = (deductionsSummary[ing.stockId] || 0) + (Number(ing.amount) * item.qty);
              });
            }
          });

          Object.entries(deductionsSummary).forEach(([stockId, deductAmount]) => {
            const stockRef = db.collection('stocks').doc(stockId);
            batch.update(stockRef, {
              current: firebase.firestore.FieldValue.increment(-deductAmount)
            });
          });

          const titleText = selectedProductionList.map(item => `${item.name} (${item.qty} หม้อ)`).join(', ');
          
          const detailsList = Object.entries(deductionsSummary).map(([stockId, deductAmount]) => {
            const stockItem = stocks.find(s => s.id === stockId);
            return `${stockItem ? stockItem.name : 'วัตถุดิบ'}: -${deductAmount} ${stockItem ? stockItem.unit : ''}`;
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${year} ${hours}:${mins} น.`;

          const logRef = db.collection('logs').doc();
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'ต้มผลิต',
            title: `ต้ม ${titleText}`,
            details: detailsList,
            note: productionNote || 'ต้มผลิตประจำวัน'
          });

          await batch.commit();
          alert('บันทึกการผลิตและตัดสต๊อกเรียบร้อยแล้ว!');
          setBatchQuantities({});
          setProductionNote('');
        } catch (error) {
          console.error("Error confirming production:", error);
          alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
        }
      };

      // --- Handlers: History ---
      const handleClearLogs = async () => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการ "ล้างประวัติย้อนหลังทั้งหมด"?')) {
          try {
            const snapshot = await db.collection('logs').get();
            const batch = db.batch();
            snapshot.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert('ล้างประวัติเรียบร้อยแล้ว');
          } catch(e) {
            alert("เกิดข้อผิดพลาดในการล้างประวัติ");
          }
        }
      };

      // --- Handlers: Stock CRUD ---
      const handleDeleteStock = async (id) => {
        if (confirm('คุณต้องการลบวัตถุดิบรายการนี้ใช่หรือไม่?')) {
          await db.collection('stocks').doc(id).delete();
        }
      };

      const handleSaveStock = async (stockData) => {
        try {
          if (stockData.id) {
            const id = stockData.id;
            delete stockData.id;
            await db.collection('stocks').doc(id).update(stockData);
          } else {
            delete stockData.id;
            await db.collection('stocks').add(stockData);
          }
          setStockModalOpen(false);
          alert('บันทึกข้อมูลวัตถุดิบเรียบร้อยแล้ว');
        } catch (err) {
          console.error("Error saving stock:", err);
          alert("ไม่สามารถบันทึกวัตถุดิบได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      // --- Handlers: Quick Restock (Batch Multiple Items) ---
      const handleBatchRestock = async (restockItemsMap, globalNote) => {
        try {
          const itemsToProcess = Object.entries(restockItemsMap).filter(([_, qty]) => Number(qty) > 0);
          if (itemsToProcess.length === 0) return alert('กรุณาระบุจำนวนวัตถุดิบที่ต้องการเติมอย่างน้อย 1 รายการ');

          const batch = db.batch();
          const detailsList = [];

          itemsToProcess.forEach(([stockId, qty]) => {
            const stockItem = stocks.find(s => s.id === stockId);
            const amount = Number(qty);
            if (stockItem && amount > 0) {
              const stockRef = db.collection('stocks').doc(stockId);
              batch.update(stockRef, {
                current: firebase.firestore.FieldValue.increment(amount)
              });
              detailsList.push(`${stockItem.name}: +${amount} ${stockItem.unit}`);
            }
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${year} ${hours}:${mins} น.`;

          const logRef = db.collection('logs').doc();
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'เติมสต๊อก',
            title: `เติมวัตถุดิบเข้าคลัง (${itemsToProcess.length} รายการ)`,
            details: detailsList,
            note: globalNote || 'เติมวัตถุดิบประจำวัน'
          });

          await batch.commit();
          setRestockModalOpen(false);
          alert(`เติมสต๊อกเรียบร้อยแล้วทั้งหมด ${itemsToProcess.length} รายการ!`);
        } catch (err) {
          console.error("Batch Restock error:", err);
          alert("เกิดข้อผิดพลาดในการเติมสต๊อก");
        }
      };

      // --- Handlers: BOM CRUD ---
      const handleDeleteRecipe = async (id) => {
        if (confirm('คุณต้องการลบสูตรเครื่องดื่มนี้ใช่หรือไม่?')) {
          await db.collection('recipes').doc(id).delete();
        }
      };

      const handleSaveRecipe = async (recipeObj) => {
        try {
          if (recipeObj.id) {
            const id = recipeObj.id;
            delete recipeObj.id;
            await db.collection('recipes').doc(id).update(recipeObj);
          } else {
            delete recipeObj.id;
            await db.collection('recipes').add(recipeObj);
          }
          setRecipeModalOpen(false);
          alert('บันทึกสูตรเรียบร้อยแล้ว');
        } catch (err) {
          console.error("Error saving recipe:", err);
          alert("ไม่สามารถบันทึกสูตรได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Header & Navbar */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between border-b border-slate-100 sm:border-none">
                <div className="flex items-center space-x-3">
                  <div className="bg-emerald-500 text-white p-2 rounded-xl shadow-md shadow-emerald-500/20">
                    <i data-lucide="cup-soda" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-slate-800 text-lg tracking-tight leading-none">Beverage Stock Pro</h1>
                    <p className="text-[10px] text-slate-400 font-medium">ระบบจัดการวัตถุดิบการผลิต</p>
                  </div>
                </div>

                {lowStockItems.length > 0 && (
                  <button onClick={() => setActiveTab('stock')} className="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 animate-pulse">
                    <i data-lucide="bell" className="w-3.5 h-3.5"></i>
                    <span>ใกล้หมด ({lowStockItems.length})</span>
                  </button>
                )}
              </div>

              <div className="bg-slate-100/80 p-1.5 border-t border-slate-200/60">
                <div className="max-w-7xl mx-auto flex space-x-1 overflow-x-auto no-scrollbar justify-start sm:justify-center">
                  <button onClick={() => setActiveTab('production')} className={`flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'production' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="flame" className="w-4 h-4"></i>
                    <span>บันทึกการผลิต</span>
                  </button>

                  <button onClick={() => setActiveTab('stock')} className={`flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap relative ${activeTab === 'stock' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="boxes" className="w-4 h-4"></i>
                    <span>คลังวัตถุดิบ</span>
                    {lowStockItems.length > 0 && (
                      <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                    )}
                  </button>

                  <button onClick={() => setActiveTab('bom')} className={`flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'bom' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="book-open" className="w-4 h-4"></i>
                    <span>สูตรการผลิต (BOM)</span>
                  </button>

                  <button onClick={() => setActiveTab('history')} className={`flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'history' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="history" className="w-4 h-4"></i>
                    <span>ประวัติย้อนหลัง</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content Body */}
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 my-6">

              {loading ? (
                <div className="text-center py-20 text-slate-400 font-medium text-sm">กำลังโหลดข้อมูลระบบ...</div>
              ) : (
                <>
                  {/* ================= TAB 1: บันทึกการผลิต ================= */}
                  {activeTab === 'production' && (
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      
                      <div className="lg:col-span-7 bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 custom-shadow">
                        <div className="mb-6">
                          <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📝</span> บันทึกต้มน้ำชาประจำวัน
                          </h2>
                          <p className="text-xs text-slate-400 mt-1">กดเพิ่ม/ลดจำนวนหม้อต้มที่การ์ดเมนู เพื่อสรุปรายการต้มอัตโนมัติ</p>
                        </div>

                        {/* ช่องค้นหาเมนูสำหรับบันทึกการผลิต (แก้ไอคอนแว่นขยายแล้ว) */}
                        <div className="mb-4 relative">
                          <input
                            type="text"
                            placeholder="ค้นหาชื่อสูตร / เมนูต้มชา..."
                            value={searchProduction}
                            onChange={(e) => setSearchProduction(e.target.value)}
                            className="w-full px-4 py-2.5 text-xs sm:text-sm rounded-xl custom-input pl-10"
                          />
                          <span className="absolute left-3.5 top-3 text-slate-400 text-xs">🔍</span>
                          {searchProduction && (
                            <button onClick={() => setSearchProduction('')} className="absolute right-3 top-2.5 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                          )}
                        </div>

                        {filteredProductionRecipes.length === 0 ? (
                          <div className="text-center py-12 text-slate-400 text-sm">ไม่พบสูตรเครื่องดื่มที่ตรงกับการค้นหา</div>
                        ) : (
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                            {filteredProductionRecipes.map(recipe => {
                              const qty = batchQuantities[recipe.id] || 0;
                              const isSelected = qty > 0;
                              return (
                                <div key={recipe.id} className={`border-2 rounded-2xl p-4 transition-all duration-200 relative flex flex-col justify-between ${isSelected ? 'border-emerald-500 bg-emerald-50/20' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                                  
                                  {isSelected && (
                                    <div className="absolute top-3 right-3 bg-emerald-500 text-white rounded-full p-0.5">
                                      <i data-lucide="check" className="w-4 h-4"></i>
                                    </div>
                                  )}

                                  <div className="flex items-center space-x-3 mb-4">
                                    <img src={recipe.image || DEFAULT_IMAGE} className="w-16 h-16 rounded-2xl object-cover border border-slate-200 shadow-sm" />
                                    <div>
                                      <h3 className="font-bold text-slate-800 text-base">{recipe.name}</h3>
                                      <p className="text-xs text-slate-400">{recipe.yieldInfo}</p>
                                    </div>
                                  </div>

                                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-1.5 flex items-center justify-between">
                                    <button onClick={() => handleQuantityChange(recipe.id, -1)} className="w-10 h-10 rounded-lg bg-white border border-slate-300 font-bold text-lg text-slate-700 hover:bg-slate-100 active:scale-95 transition flex items-center justify-center shadow-sm">
                                      -
                                    </button>
                                    <div className="text-center">
                                      <span className="font-bold text-lg text-slate-800">{qty}</span>
                                      <span className="text-[10px] text-slate-400 block -mt-1 font-medium">หม้อ / ถัง</span>
                                    </div>
                                    <button onClick={() => handleQuantityChange(recipe.id, 1)} className="w-10 h-10 rounded-lg bg-emerald-500 font-bold text-lg text-white hover:bg-emerald-600 active:scale-95 transition flex items-center justify-center shadow-md shadow-emerald-500/20">
                                      +
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}

                        <div className="mt-4">
                          <label className="block text-xs font-semibold text-slate-600 mb-1.5">หมายเหตุ / ชื่อผู้ต้ม</label>
                          <input type="text" placeholder="เช่น ต้มรอบเช้า โดย ช่างต้มเอ" value={productionNote} onChange={(e) => setProductionNote(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                        </div>
                      </div>

                      <div className="lg:col-span-5">
                        <div className="bg-[#0b1329] text-white rounded-3xl p-6 sm:p-8 shadow-2xl sticky top-28 border border-slate-800">
                          <div className="flex items-center gap-3 pb-4 border-b border-slate-800/80 mb-6">
                            <div className="bg-emerald-500/10 p-2 rounded-xl text-emerald-400">
                              <i data-lucide="clipboard-list" className="w-6 h-6"></i>
                            </div>
                            <div>
                              <h2 className="font-bold text-lg text-white">สรุปรายการผลิตประจำวัน</h2>
                              <p className="text-xs text-slate-400">สรุปรายการต้มชาที่เลือกต้มในรอบนี้</p>
                            </div>
                          </div>

                          <div className="space-y-3 min-h-[160px] max-h-[360px] overflow-y-auto pr-1">
                            {selectedProductionList.length === 0 ? (
                              <div className="text-center py-12 text-slate-500 text-sm font-medium">ยังไม่มีรายการที่เลือก<br/><span className="text-xs text-slate-600">กดปุ่ม + ด้านซ้ายเพื่อเลือกรายการต้ม</span></div>
                            ) : (
                              selectedProductionList.map(item => (
                                <div key={item.recipeId} className="bg-[#131c38] border border-slate-800/80 rounded-2xl p-4 flex justify-between items-center">
                                  <div className="flex items-center space-x-3">
                                    <img src={item.recipe?.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border border-slate-700" />
                                    <div>
                                      <div className="font-bold text-sm text-white">{item.name}</div>
                                      <div className="text-xs text-slate-400">{item.yieldInfo}</div>
                                    </div>
                                  </div>
                                  <div className="text-right">
                                    <div className="text-emerald-400 font-extrabold text-lg">{item.qty} หม้อ</div>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>

                          <button onClick={handleConfirmProduction} disabled={selectedProductionList.length === 0} className={`w-full mt-6 py-4 rounded-2xl font-bold text-base transition-all duration-200 flex items-center justify-center gap-2 ${selectedProductionList.length > 0 ? 'bg-emerald-500 text-slate-950 hover:bg-emerald-400 shadow-lg shadow-emerald-500/20 active:scale-98' : 'bg-slate-800/60 text-slate-500 cursor-not-allowed'}`}>
                            <i data-lucide="check-circle" className="w-5 h-5"></i>
                            ยืนยันการต้ม & ตัดสต๊อกทันที
                          </button>
                        </div>
                      </div>

                    </div>
                  )}

                  {/* ================= TAB 2: คลังวัตถุดิบ ================= */}
                  {activeTab === 'stock' && (
                    <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 custom-shadow">
                      
                      {lowStockItems.length > 0 && (
                        <div className="mb-8 bg-rose-50 border-2 border-rose-300 rounded-2xl p-5 text-rose-900 shadow-sm">
                          <div className="flex items-center justify-between mb-3">
                            <div className="flex items-center space-x-2 font-bold text-base text-rose-700">
                              <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-600 animate-bounce"></i>
                              <span>เตือนการสั่งซื้อ: วัตถุดิบใกล้หมดคลัง ({lowStockItems.length} รายการ)</span>
                            </div>
                            <button onClick={() => setRestockModalOpen(true)} className="bg-rose-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl hover:bg-rose-700 transition shadow-md">
                              📥 เติมสต๊อกทันที
                            </button>
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                            {lowStockItems.map(item => (
                              <div key={item.id} className="bg-white p-3 rounded-xl border border-rose-200 flex items-center justify-between">
                                <span className="font-bold text-sm text-slate-800">{item.name}</span>
                                <span className="text-xs font-bold text-rose-600 bg-rose-100 px-2 py-1 rounded-lg">
                                  เหลือ {item.current} {item.unit} (สั่งเพิ่มด่วน)
                                </span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                        <div>
                          <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📦</span> คลังวัตถุดิบคงเหลือ (Real-time Stock)
                          </h2>
                          <p className="text-xs text-slate-400 mt-1">จัดการข้อมูลสต๊อก เติมสต๊อก หรือแก้ไขวัตถุดิบ</p>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-3">
                          <button onClick={() => setRestockModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-5 py-3 rounded-2xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                            <i data-lucide="plus-circle" className="w-5 h-5"></i> 📥 เติมสต๊อกวัตถุดิบ
                          </button>
                          
                          <button onClick={() => { setEditingStock(null); setStockModalOpen(true); }} className="bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm px-5 py-3 rounded-2xl transition shadow-lg shadow-slate-800/20 flex items-center justify-center gap-2">
                            <i data-lucide="plus" className="w-5 h-5"></i> เพิ่มวัตถุดิบใหม่
                          </button>
                        </div>
                      </div>

                      {/* ช่องค้นหาคลังวัตถุดิบ (แก้ไอคอนแว่นขยายแล้ว) */}
                      <div className="mb-6 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาวัตถุดิบในคลัง หรือหมวดหมู่..."
                          value={searchStock}
                          onChange={(e) => setSearchStock(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchStock && (
                          <button onClick={() => setSearchStock('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredStocks.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบวัตถุดิบที่ตรงกับการค้นหา</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                          {filteredStocks.map(item => {
                            const currentVal = Number(item.current) || 0;
                            const minVal = Number(item.minAlert) || 0;
                            const isLow = currentVal <= minVal;

                            return (
                              <div key={item.id} className="border border-slate-200 rounded-2xl p-5 bg-white shadow-sm flex flex-col justify-between hover:shadow-md transition">
                                <div>
                                  <div className="flex justify-between items-start mb-3">
                                    <div>
                                      <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-100">{item.category || 'ทั่วไป'}</span>
                                      <h3 className="font-bold text-base text-slate-800 mt-2">{item.name}</h3>
                                    </div>
                                    <div className="flex space-x-1">
                                      <button onClick={() => { setEditingStock(item); setStockModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-50">
                                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                                      </button>
                                      <button onClick={() => handleDeleteStock(item.id)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                      </button>
                                    </div>
                                  </div>

                                  <div className="my-4">
                                    <div className="flex justify-between items-baseline mb-1">
                                      <span className="text-xs text-slate-400 font-medium">คงเหลือปัจจุบัน</span>
                                      <span className={`text-2xl font-extrabold ${isLow ? 'text-rose-600' : 'text-slate-800'}`}>
                                        {currentVal} <span className="text-xs font-normal text-slate-500">{item.unit}</span>
                                      </span>
                                    </div>
                                    <div className="text-right text-[11px] text-slate-400">
                                      จุดเตือนสั่งซื้อ: {minVal} {item.unit}
                                    </div>
                                  </div>
                                </div>

                                <div className="pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                                  <span>ราคาต่อหน่วย: ฿{item.pricePerUnit || 0}</span>
                                  {isLow && <span className="text-rose-600 font-bold bg-rose-50 px-2 py-0.5 rounded">ใกล้หมด</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                    </div>
                  )}

                  {/* ================= TAB 3: สูตรการผลิต (BOM) ================= */}
                  {activeTab === 'bom' && (
                    <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                        <div>
                          <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📖</span> จัดการสูตรการผลิต (Bill of Materials)
                          </h2>
                          <p className="text-xs text-slate-400 mt-1">กำหนดสัดส่วนวัตถุดิบที่ใช้ต้มในแต่ละสูตร</p>
                        </div>
                        <button onClick={() => { setEditingRecipe(null); setRecipeModalOpen(true); }} className="bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm px-5 py-3 rounded-2xl transition shadow-lg shadow-slate-800/20 flex items-center justify-center gap-2">
                          <i data-lucide="plus" className="w-5 h-5"></i> เพิ่มสูตรใหม่
                        </button>
                      </div>

                      {/* ช่องค้นหาสูตร (แก้ไอคอนแว่นขยายแล้ว) */}
                      <div className="mb-6 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาชื่อสูตร..."
                          value={searchRecipe}
                          onChange={(e) => setSearchRecipe(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchRecipe && (
                          <button onClick={() => setSearchRecipe('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredRecipes.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบสูตรการผลิตที่ตรงกับการค้นหา</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          {filteredRecipes.map(recipe => (
                            <div key={recipe.id} className="border border-slate-200 rounded-2xl p-5 bg-white shadow-sm hover:shadow-md transition">
                              <div className="flex items-start justify-between mb-4">
                                <div className="flex items-center space-x-3">
                                  <img src={recipe.image || DEFAULT_IMAGE} className="w-14 h-14 rounded-xl object-cover border border-slate-200" />
                                  <div>
                                    <h3 className="font-bold text-base text-slate-800">{recipe.name}</h3>
                                    <span className="text-xs text-slate-400">{recipe.yieldInfo || '1 หม้อ/ถัง'}</span>
                                  </div>
                                </div>
                                <div className="flex space-x-1">
                                  <button onClick={() => { setEditingRecipe(recipe); setRecipeModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-50">
                                    <i data-lucide="edit-3" className="w-4 h-4"></i>
                                  </button>
                                  <button onClick={() => handleDeleteRecipe(recipe.id)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50">
                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                  </button>
                                </div>
                              </div>

                              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
                                <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">ส่วนผสมต่อ 1 หม้อ:</span>
                                <ul className="space-y-1.5 text-xs text-slate-700">
                                  {recipe.ingredients && recipe.ingredients.map((ing, idx) => {
                                    const stockItem = stocks.find(s => s.id === ing.stockId);
                                    return (
                                      <li key={idx} className="flex justify-between items-center">
                                        <span>• {stockItem ? stockItem.name : 'วัตถุดิบระบุไม่ได้'}</span>
                                        <span className="font-semibold text-slate-900">{ing.amount} {stockItem ? stockItem.unit : ''}</span>
                                      </li>
                                    );
                                  })}
                                </ul>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                    </div>
                  )}

                  {/* ================= TAB 4: ประวัติย้อนหลัง ================= */}
                  {activeTab === 'history' && (
                    <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                        <div>
                          <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📜</span> ประวัติการทำรายการย้อนหลัง
                          </h2>
                          <p className="text-xs text-slate-400 mt-1">ประวัติการต้มชา และการเติมวัตถุดิบเข้าคลังทั้งหมด</p>
                        </div>
                        {logs.length > 0 && (
                          <button onClick={handleClearLogs} className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
                            <i data-lucide="trash" className="w-4 h-4"></i> ล้างประวัติทั้งหมด
                          </button>
                        )}
                      </div>

                      {/* ช่องค้นหาประวัติ (แก้ไอคอนแว่นขยายแล้ว) */}
                      <div className="mb-6 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาตามวันที่, ประเภท, ชื่อรายการ หรือหมายเหตุ..."
                          value={searchHistory}
                          onChange={(e) => setSearchHistory(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchHistory && (
                          <button onClick={() => setSearchHistory('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredLogs.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบประวัติการทำรายการ</div>
                      ) : (
                        <div className="space-y-4">
                          {filteredLogs.map(log => {
                            const isProduction = log.type === 'ต้มผลิต';
                            return (
                              <div key={log.id} className="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-white hover:border-slate-300 transition shadow-sm">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3 pb-3 border-b border-slate-100">
                                  <div className="flex items-center space-x-2.5">
                                    <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${isProduction ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                      {log.type || 'บันทึก'}
                                    </span>
                                    <h3 className="font-bold text-sm text-slate-800">{log.title}</h3>
                                  </div>
                                  <span className="text-xs text-slate-400 font-medium">{log.datetime}</span>
                                </div>

                                {log.details && log.details.length > 0 && (
                                  <div className="mb-3 bg-slate-50 rounded-xl p-3 text-xs text-slate-600 space-y-1">
                                    {log.details.map((dt, i) => (
                                      <div key={i} className="flex items-center space-x-1.5">
                                        <span className="text-slate-400">•</span>
                                        <span>{dt}</span>
                                      </div>
                                    ))}
                                  </div>
                                )}

                                {log.note && (
                                  <div className="text-xs text-slate-400 italic">
                                    💬 หมายเหตุ: {log.note}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}

                    </div>
                  )}
                </>
              )}

            </main>
          </div>

          <footer className="text-center py-6 text-xs text-slate-400 border-t border-slate-200/60 bg-white">
            Beverage Stock Pro &copy; ระบบสต๊อกชา & เติมวัตถุดิบ
          </footer>

          {/* Render All Modals */}
          <StockModal
            isOpen={stockModalOpen}
            onClose={() => setStockModalOpen(false)}
            onSave={handleSaveStock}
            editingStock={editingStock}
          />

          <RestockModal
            isOpen={restockModalOpen}
            onClose={() => setRestockModalOpen(false)}
            stocks={stocks}
            onConfirmBatchRestock={handleBatchRestock}
          />

          <RecipeModal
            isOpen={recipeModalOpen}
            onClose={() => setRecipeModalOpen(false)}
            onSave={handleSaveRecipe}
            editingRecipe={editingRecipe}
            stocks={stocks}
            handleImageUpload={handleImageUpload}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

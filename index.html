                                      <button onClick={() => { setEditingStock(item); setStockModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-50">
                                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                                      </button>
                                      <button onClick={() => handleDeleteStock(item.id)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                      </button>
                                    </div>
                                  </div>

                                  <div className="my-3">
                                    <div className="flex justify-between items-baseline mb-1">
                                      <span className="text-xs text-slate-400 font-medium">คงเหลือปัจจุบัน</span>
                                      <span className={`text-xl sm:text-2xl font-extrabold ${isLow ? 'text-rose-600' : 'text-slate-800'}`}>
                                        {currentVal} <span className="text-xs font-normal text-slate-500">{item.unit}</span>
                                      </span>
                                    </div>
                                    <div className="text-right text-[10px] sm:text-[11px] text-slate-400">
                                      จุดเตือนสั่งซื้อ: {minVal} {item.unit}
                                    </div>
                                  </div>
                                </div>

                                <div className="pt-2 border-t border-slate-100 flex justify-end items-center text-xs text-slate-500">
                                  {isLow && <span className="text-rose-600 font-bold bg-rose-50 px-2 py-0.5 rounded text-[11px]">ใกล้หมด</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                    </div>
                  )}

                  {/* ================= TAB 3: สูตรการผลิต (BOM) ================= */}
                  {activeTab === 'bom' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📖</span> จัดการสูตรการผลิต (Bill of Materials)
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">กำหนดสัดส่วนวัตถุดิบที่ใช้ต้มในแต่ละสูตร</p>
                        </div>
                        <button onClick={() => { setEditingRecipe(null); setRecipeModalOpen(true); }} className="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs sm:text-sm px-4 py-3 rounded-2xl transition shadow-lg shadow-slate-800/20 flex items-center justify-center gap-2">
                          <i data-lucide="plus" className="w-4 h-4"></i> เพิ่มสูตรใหม่
                        </button>
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาชื่อสูตร..."
                          value={searchRecipe}
                          onChange={(e) => setSearchRecipe(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchRecipe && (
                          <button onClick={() => setSearchRecipe('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredRecipes.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบสูตรการผลิตที่ตรงกับการค้นหา</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                          {filteredRecipes.map(recipe => (
                            <div key={recipe.id} className="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-white shadow-sm hover:shadow-md transition">
                              <div className="flex items-start justify-between mb-4">
                                <div className="flex items-center space-x-3">
                                  <img src={recipe.image || DEFAULT_IMAGE} className="w-12 h-12 sm:w-14 sm:h-14 rounded-xl object-cover border border-slate-200" alt={recipe.name} />
                                  <div>
                                    <h3 className="font-bold text-sm sm:text-base text-slate-800">{recipe.name}</h3>
                                    <span className="text-xs text-slate-400">{recipe.yieldInfo || '1 หม้อ/ถัง'}</span>
                                  </div>
                                </div>
                                <div className="flex space-x-1">
                                  <button onClick={() => { setEditingRecipe(recipe); setRecipeModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-50">
                                    <i data-lucide="edit-3" className="w-4 h-4"></i>
                                  </button>
                                  <button onClick={() => handleDeleteRecipe(recipe.id)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50">
                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                  </button>
                                </div>
                              </div>

                              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
                                <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">ส่วนผสมต่อ 1 หม้อ:</span>
                                <ul className="space-y-1.5 text-xs text-slate-700">
                                  {recipe.ingredients && recipe.ingredients.map((ing, idx) => {
                                    const stockItem = stocks.find(s => s.id === ing.stockId);
                                    return (
                                      <li key={idx} className="flex justify-between items-center">
                                        <span>• {stockItem ? stockItem.name : 'วัตถุดิบระบุไม่ได้'}</span>
                                        <span className="font-semibold text-slate-900">{ing.amount} {ing.unit || (stockItem ? stockItem.unit : '')}</span>
                                      </li>
                                    );
                                  })}
                                </ul>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                    </div>
                  )}

                  {/* ================= TAB 4: ประวัติย้อนหลัง ================= */}
                  {activeTab === 'history' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📜</span> ประวัติการทำรายการย้อนหลัง
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">ประวัติการต้มชา การเติมวัตถุดิบ และการย้ายออกหน้าร้านทั้งหมด</p>
                        </div>
                        {logs.length > 0 && (
                          <button onClick={handleClearLogs} className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
                            <i data-lucide="trash" className="w-4 h-4"></i> ล้างประวัติทั้งหมด
                          </button>
                        )}
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาตามวันที่, ประเภท, ชื่อรายการ..."
                          value={searchHistory}
                          onChange={(e) => setSearchHistory(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchHistory && (
                          <button onClick={() => setSearchHistory('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredLogs.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบประวัติการทำรายการ</div>
                      ) : (
                        <div className="space-y-3 sm:space-y-4">
                          {filteredLogs.map(log => {
                            const isProduction = log.type === 'ต้มผลิต';
                            const isTransfer = log.type === 'ย้ายไปหน้าร้าน';

                            let badgeStyle = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            if (isProduction) badgeStyle = 'bg-amber-50 text-amber-700 border-amber-200';
                            if (isTransfer) badgeStyle = 'bg-blue-50 text-blue-700 border-blue-200';

                            return (
                              <div key={log.id} className="border border-slate-200 rounded-2xl p-3.5 sm:p-5 bg-white hover:border-slate-300 transition shadow-sm">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-2.5 pb-2.5 border-b border-slate-100">
                                  <div className="flex items-center space-x-2">
                                    <span className={`text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-lg border ${badgeStyle}`}>
                                      {log.type || 'บันทึก'}
                                    </span>
                                    <h3 className="font-bold text-xs sm:text-sm text-slate-800">{log.title}</h3>
                                  </div>
                                  <span className="text-[10px] sm:text-xs text-slate-400 font-medium">{log.datetime}</span>
                                </div>

                                {log.details && log.details.length > 0 && (
                                  <div className="mb-2 bg-slate-50 rounded-xl p-2.5 text-[11px] sm:text-xs text-slate-600 space-y-1">
                                    {log.details.map((dt, i) => (
                                      <div key={i} className="flex items-center space-x-1.5">
                                        <span className="text-slate-400">•</span>
                                        <span>{dt}</span>
                                      </div>
                                    ))}
                                  </div>
                                )}

                                {log.note && (
                                  <div className="text-[11px] sm:text-xs text-slate-400 italic">
                                    💬 หมายเหตุ: {log.note}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}

                    </div>
                  )}
                </>
              )}

            </main>
          </div>

          <footer className="text-center py-5 text-xs text-slate-400 border-t border-slate-200/60 bg-white">
            ร้านติดใจ &copy; ระบบจัดการสต๊อกของ & เติมของ
          </footer>

          {/* Render Modals */}
          <StockModal
            isOpen={stockModalOpen}
            onClose={() => setStockModalOpen(false)}
            onSave={handleSaveStock}
            editingStock={editingStock}
            handleImageUpload={handleImageUpload}
          />

          <RestockModal
            isOpen={restockModalOpen}
            onClose={() => setRestockModalOpen(false)}
            stocks={stocks}
            onConfirmBatchRestock={handleBatchRestock}
          />

          <TransferModal
            isOpen={transferModalOpen}
            onClose={() => setTransferModalOpen(false)}
            stocks={stocks}
            onConfirmTransfer={handleTransferToStorefront}
          />

          <PrintSummaryModal
            isOpen={printModalOpen}
            onClose={() => setPrintModalOpen(false)}
            logs={logs}
            lowStockItems={lowStockItems}
          />

          <RecipeModal
            isOpen={recipeModalOpen}
            onClose={() => setRecipeModalOpen(false)}
            onSave={handleSaveRecipe}
            editingRecipe={editingRecipe}
            stocks={stocks}
            handleImageUpload={handleImageUpload}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

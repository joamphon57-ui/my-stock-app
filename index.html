                            })}
                          </div>
                        )}

                        <div className="mt-4">
                          <label className="block text-xs font-semibold text-slate-600 mb-1.5">หมายเหตุ / ผู้ปรุง</label>
                          <input type="text" placeholder="เช่น ปรุงรอบเช้า / สมชาย..." value={productionNote} onChange={(e) => setProductionNote(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                        </div>
                      </div>

                      <div className="lg:col-span-5">
                        <div className="bg-[#0b1329] text-white rounded-3xl p-5 sm:p-8 shadow-2xl sticky top-28 border border-slate-800">
                          <div className="flex items-center gap-3 pb-4 border-b border-slate-800/80 mb-4 sm:mb-6">
                            <div className="bg-emerald-500/10 p-2 rounded-xl text-emerald-400">
                              <i data-lucide="clipboard-list" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                            </div>
                            <div>
                              <h2 className="font-bold text-base sm:text-lg text-white">สรุปรายการผลิตประจำวัน</h2>
                              <p className="text-[11px] text-slate-400">รายการปรุงที่เลือกในรอบนี้</p>
                            </div>
                          </div>

                          <div className="space-y-2.5 min-h-[140px] max-h-[300px] overflow-y-auto pr-1">
                            {selectedProductionList.length === 0 ? (
                              <div className="text-center py-10 text-slate-500 text-xs sm:text-sm font-medium">ยังไม่มีรายการที่เลือก<br/><span className="text-[10px] text-slate-600">กดปุ่ม + ด้านซ้ายเพื่อเลือกรายการ</span></div>
                            ) : (
                              selectedProductionList.map(item => (
                                <div key={item.recipeId} className="bg-[#131c38] border border-slate-800/80 rounded-2xl p-3 flex justify-between items-center">
                                  <div className="flex items-center space-x-2.5">
                                    <img src={item.recipe?.image || DEFAULT_IMAGE} className="w-10 h-10 rounded-xl object-cover border border-slate-700" alt={item.name} />
                                    <div>
                                      <div className="font-bold text-xs sm:text-sm text-white">{item.name}</div>
                                      <div className="text-[10px] text-slate-400">{item.yieldInfo || '1 ถัง'}</div>
                                    </div>
                                  </div>
                                  <div className="text-right">
                                    <div className="text-emerald-400 font-extrabold text-base sm:text-lg">{item.qty} ถัง</div>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>

                          <button onClick={handleConfirmProduction} disabled={selectedProductionList.length === 0} className={`w-full mt-5 py-3.5 sm:py-4 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-2 ${selectedProductionList.length > 0 ? 'bg-emerald-500 text-slate-950 hover:bg-emerald-400 shadow-lg shadow-emerald-500/20 active:scale-98' : 'bg-slate-800/60 text-slate-500 cursor-not-allowed'}`}>
                            <i data-lucide="check-circle" className="w-5 h-5"></i>
                            ยืนยันการปรุง & ตัดสต๊อกทันที
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: คลังวัตถุดิบ */}
                  {activeTab === 'stock' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      
                      {lowStockItems.length > 0 && (
                        <div className="mb-6 sm:mb-8 bg-rose-50 border-2 border-rose-300 rounded-2xl p-4 sm:p-5 text-rose-900 shadow-sm">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div className="flex items-center space-x-2 font-bold text-sm sm:text-base text-rose-700">
                              <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-600 animate-bounce"></i>
                              <span>เตือนการสั่งซื้อ: วัตถุดิบใกล้หมดคลัง ({lowStockItems.length} รายการ)</span>
                            </div>
                            <button onClick={() => setRestockModalOpen(true)} className="bg-rose-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl hover:bg-rose-700 transition shadow-md w-full sm:w-auto text-center">
                              📥 เติมสต๊อกทันที
                            </button>
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                            {lowStockItems.map(item => (
                              <div key={item.id} className="bg-white p-2.5 rounded-xl border border-rose-200 flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                  <img src={item.image || DEFAULT_IMAGE} className="w-8 h-8 rounded-md object-cover" alt={item.name} />
                                  <span className="font-bold text-xs sm:text-sm text-slate-800">{item.name}</span>
                                </div>
                                <span className="text-[11px] font-bold text-rose-600 bg-rose-100 px-2 py-0.5 rounded-lg">
                                  เหลือ {item.current} {item.unit}
                                </span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📦</span> คลังวัตถุดิบคงเหลือ (Real-time Stock)
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">จัดการข้อมูลสต๊อก เติมสต๊อก หรือเอาของออกไปหน้าร้าน</p>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                          <button onClick={() => setTransferModalOpen(true)} className="btn-pill btn-orange-pill text-xs sm:text-sm px-5 py-2.5 active:scale-95">
                            <i data-lucide="upload" className="w-4 h-4"></i> เอาของออกไปหน้าร้าน
                          </button>

                          <button onClick={() => setRestockModalOpen(true)} className="btn-pill btn-green-pill text-xs sm:text-sm px-5 py-2.5 active:scale-95">
                            <i data-lucide="plus-circle" className="w-4 h-4"></i> เติมสต๊อก
                          </button>
                          
                          <button onClick={() => { setEditingStock(null); setStockModalOpen(true); }} className="btn-pill btn-dark-pill text-xs sm:text-sm px-5 py-2.5 active:scale-95">
                            <span className="text-base font-normal leading-none">+</span> เพิ่มวัตถุดิบใหม่
                          </button>
                        </div>
                      </div>

                      {/* ค้นหา & หมวดหมู่ */}
                      <div className="space-y-3 mb-5">
                        <div className="relative">
                          <input
                            type="text"
                            placeholder="ค้นหาวัตถุดิบในคลัง..."
                            value={searchStock}
                            onChange={(e) => setSearchStock(e.target.value)}
                            className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                          />
                          <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                          {searchStock && (
                            <button onClick={() => setSearchStock('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                          )}
                        </div>

                        {/* Filter หมวดหมู่แบบยืดหยุ่น + ปุ่มจัดการ */}
                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                          <button
                            onClick={() => setSelectedCategory('all')}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                              selectedCategory === 'all'
                                ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20'
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            ทั้งหมด
                          </button>
                          {categories.map((cat) => (
                            <button
                              key={cat.id}
                              onClick={() => setSelectedCategory(cat.name)}
                              className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                                selectedCategory === cat.name
                                  ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20'
                                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                              }`}
                            >
                              {cat.name}
                            </button>
                          ))}
                          <button
                            onClick={() => setCategoryModalOpen(true)}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-200 text-slate-700 hover:bg-slate-300 transition-all whitespace-nowrap flex items-center gap-1"
                          >
                            <span>⚙️</span> จัดการหมวดหมู่
                          </button>
                        </div>
                      </div>

                      {filteredStocks.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบวัตถุดิบที่ตรงกับการค้นหา</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                          {filteredStocks.map(item => {
                            const currentVal = Number(item.current) || 0;
                            const minVal = Number(item.minAlert) || 0;
                            const isLow = currentVal <= minVal;

                            return (
                              <div key={item.id} className="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-white shadow-sm flex flex-col justify-between hover:shadow-md transition">
                                <div>
                                  <div className="flex justify-between items-start mb-3">
                                    <div className="flex items-center space-x-3">
                                      <img src={item.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border border-slate-200" alt={item.name} />
                                      <div>
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">{item.category || 'ทั่วไป'}</span>
                                        <h3 className="font-bold text-sm sm:text-base text-slate-800 mt-0.5">{item.name}</h3>
                                      </div>
                                    </div>
                                    <div className="flex space-x-1">
                                      <button onClick={() => { setEditingStock(item); setStockModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-50">
                                        <i data-lucide="edit-3" className="w-4 h-4"></i>
                                      </button>
                                      <button onClick={() => handleDeleteStock(item.id)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50">
                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                      </button>
                                    </div>
                                  </div>

                                  <div className="my-3">
                                    <div className="flex justify-between items-baseline mb-1">
                                      <span className="text-xs text-slate-400 font-medium">คงเหลือปัจจุบัน</span>
                                      <span className={`text-xl sm:text-2xl font-extrabold ${isLow ? 'text-rose-600' : 'text-slate-800'}`}>
                                        {currentVal} <span className="text-xs font-normal text-slate-500">{item.unit}</span>
                                      </span>
                                    </div>
                                    <div className="text-right text-[10px] sm:text-[11px] text-slate-400">
                                      จุดเตือนสั่งซื้อ: {minVal} {item.unit}
                                    </div>
                                  </div>
                                </div>

                                <div className="pt-2 border-t border-slate-100 flex justify-end items-center text-xs text-slate-500">
                                  {isLow && <span className="text-rose-600 font-bold bg-rose-50 px-2 py-0.5 rounded text-[11px]">ใกล้หมด</span>}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                    </div>
                  )}

                  {/* TAB 3: สูตรการผลิต (BOM) */}
                  {activeTab === 'bom' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📖</span> จัดการสูตรการปรุง (Bill of Materials)
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">กำหนดสัดส่วนวัตถุดิบที่ใช้ปรุงในแต่ละสูตร</p>
                        </div>
                        <button onClick={() => { setEditingRecipe(null); setRecipeModalOpen(true); }} className="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs sm:text-sm px-4 py-3 rounded-2xl transition shadow-lg shadow-slate-800/20 flex items-center justify-center gap-2">
                          <i data-lucide="plus" className="w-4 h-4"></i> เพิ่มสูตรใหม่
                        </button>
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาชื่อสูตร..."
                          value={searchRecipe}
                          onChange={(e) => setSearchRecipe(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchRecipe && (
                          <button onClick={() => setSearchRecipe('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredRecipes.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบสูตรการผลิตที่ตรงกับการค้นหา</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                          {filteredRecipes.map(recipe => (
                            <div key={recipe.id} className="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-white shadow-sm hover:shadow-md transition">
                              <div className="flex items-start justify-between mb-4">
                                <div className="flex items-center space-x-3">
                                  <img src={recipe.image || DEFAULT_IMAGE} className="w-12 h-12 sm:w-14 sm:h-14 rounded-xl object-cover border border-slate-200" alt={recipe.name} />
                                  <div>
                                    <h3 className="font-bold text-sm sm:text-base text-slate-800">{recipe.name}</h3>
                                    <span className="text-xs text-slate-400">{recipe.yieldInfo || '1 ถัง'}</span>
                                  </div>
                                </div>
                                <div className="flex space-x-1">
                                  <button onClick={() => { setEditingRecipe(recipe); setRecipeModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-emerald-600 rounded-lg hover:bg-slate-50">
                                    <i data-lucide="edit-3" className="w-4 h-4"></i>
                                  </button>
                                  <button onClick={() => handleDeleteRecipe(recipe.id)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50">
                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                  </button>
                                </div>
                              </div>

                              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
                                <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-2">ส่วนผสมต่อ 1 ถัง:</span>
                                <ul className="space-y-1.5 text-xs text-slate-700">
                                  {recipe.ingredients && recipe.ingredients.map((ing, idx) => {
                                    const stockItem = stocks.find(s => s.id === ing.stockId);
                                    return (
                                      <li key={idx} className="flex justify-between items-center">
                                        <span>• {stockItem ? stockItem.name : 'วัตถุดิบระบุไม่ได้'}</span>
                                        <span className="font-semibold text-slate-900">{ing.amount} {ing.unit || (stockItem ? stockItem.unit : '')}</span>
                                      </li>
                                    );
                                  })}
                                </ul>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}

                    </div>
                  )}

                  {/* TAB 4: บันทึกการผลิต (แสดงเฉพาะประวัติปรุงผลิต/ต้มผลิต) */}
                  {activeTab === 'history' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📜</span> บันทึกการผลิต
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">ประวัติการปรุงและการผลิตน้ำปรุงย้อนหลังทั้งหมด</p>
                        </div>
                        {filteredLogs.length > 0 && (
                          <button onClick={handleClearLogs} className="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs px-3.5 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5">
                            <i data-lucide="trash" className="w-4 h-4"></i> ล้างบันทึกการผลิตทั้งหมด
                          </button>
                        )}
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาตามวันที่, ชื่อรายการปรุง..."
                          value={searchHistory}
                          onChange={(e) => setSearchHistory(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchHistory && (
                          <button onClick={() => setSearchHistory('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredLogs.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบประวัติการผลิต</div>
                      ) : (
                        <div className="space-y-3 sm:space-y-4">
                          {filteredLogs.map(log => {
                            const badgeStyle = 'bg-amber-50 text-amber-700 border-amber-200';
                            const isUnlocked = unlockedLogDetails[log.id];

                            return (
                              <div key={log.id} className="border border-slate-200 rounded-2xl p-3.5 sm:p-5 bg-white hover:border-slate-300 transition shadow-sm">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2.5 pb-2.5 border-b border-slate-100">
                                  <div className="flex items-center space-x-2">
                                    <span className={`text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-lg border ${badgeStyle}`}>
                                      {log.type || 'ปรุงผลิต'}
                                    </span>
                                    <h3 className="font-bold text-xs sm:text-sm text-slate-800">{log.title}</h3>
                                  </div>
                                  
                                  <div className="flex items-center justify-between sm:justify-end gap-3">
                                    <span className="text-[10px] sm:text-xs text-slate-400 font-medium">{log.datetime}</span>
                                    <button
                                      onClick={() => setLogToDelete(log)}
                                      className="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 p-1.5 rounded-lg transition text-xs font-bold flex items-center gap-1"
                                      title="ลบรายการนี้"
                                    >
                                      <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> ลบ
                                    </button>
                                  </div>
                                </div>

                                {log.details && log.details.length > 0 && (
                                  <div className="mb-2 bg-slate-50 rounded-xl p-2.5 text-[11px] sm:text-xs text-slate-600">
                                    {isUnlocked ? (
                                      <div className="space-y-1">
                                        <div className="flex justify-between items-center mb-1 pb-1 border-b border-slate-200/60">
                                          <span className="font-bold text-slate-700">วัตถุดิบที่ถูกตัดไป:</span>
                                          <button onClick={() => handleToggleShowDetails(log.id)} className="text-[10px] text-slate-400 hover:text-slate-600">🙈 ซ่อน</button>
                                        </div>
                                        {log.details.map((dt, i) => (
                                          <div key={i} className="flex items-center space-x-1.5">
                                            <span className="text-slate-400">•</span>
                                            <span>{dt}</span>
                                          </div>
                                        ))}
                                      </div>
                                    ) : (
                                      <div className="flex items-center justify-between py-0.5">
                                        <span className="text-slate-400 italic">🔒 ส่วนผสมวัตถุดิบถูกซ่อนไว้</span>
                                        <button
                                          onClick={() => handleToggleShowDetails(log.id)}
                                          className="text-emerald-600 font-bold hover:underline text-[11px] flex items-center gap-1"
                                        >
                                          👁️ แสดงวัตถุดิบที่ใช้ไป
                                        </button>
                                      </div>
                                    )}
                                  </div>
                                )}

                                {log.note && (
                                  <div className="text-[11px] sm:text-xs text-slate-400 italic">
                                    💬 หมายเหตุ: {log.note}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}

                    </div>
                  )}

                  {/* TAB 5: บันทึกวัตถุดิบ เข้า - ออก */}
                  {activeTab === 'movements' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>🔄</span> บันทึกวัตถุดิบ เข้า - ออก
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">สรุปประวัติรายการที่มีการเติมวัตถุดิบเข้าคลัง และเอาของออกไปหน้าร้าน</p>
                        </div>
                      </div>

                      <div className="mb-5 relative">
                        <input
                          type="text"
                          placeholder="ค้นหาประวัติวัตถุดิบเข้า-ออก..."
                          value={searchMovement}
                          onChange={(e) => setSearchMovement(e.target.value)}
                          className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                        />
                        <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                        {searchMovement && (
                          <button onClick={() => setSearchMovement('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                        )}
                      </div>

                      {filteredMovements.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบประวัติรายการวัตถุดิบเข้า-ออก</div>
                      ) : (
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs sm:text-sm border-collapse">
                            <thead>
                              <tr className="bg-slate-100/80 border-b border-slate-200 text-slate-600">
                                <th className="p-3 font-bold rounded-l-xl">วัน-เวลา</th>
                                <th className="p-3 font-bold">ประเภท</th>
                                <th className="p-3 font-bold">รายการ</th>
                                <th className="p-3 font-bold">รายละเอียด (เข้า / ออก)</th>
                                <th className="p-3 font-bold">หมายเหตุ</th>
                                <th className="p-3 font-bold text-center rounded-r-xl">จัดการ</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {filteredMovements.map(log => {
                                const isRestock = log.type === 'เติมสต๊อก';
                                return (
                                  <tr key={log.id} className="hover:bg-slate-50/80 transition">
                                    <td className="p-3 text-slate-500 whitespace-nowrap font-medium text-xs">{log.datetime}</td>
                                    <td className="p-3 whitespace-nowrap">
                                      {isRestock ? (
                                        <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">
                                          + เติมสต๊อก (เข้า)
                                        </span>
                                      ) : (
                                        <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                                          - เอาออก (หน้าร้าน)
                                        </span>
                                      )}
                                    </td>
                                    <td className="p-3 font-bold text-slate-800 whitespace-nowrap">{log.title}</td>
                                    <td className="p-3">
                                      {log.details && log.details.length > 0 ? (
                                        <div className="flex flex-wrap gap-1">
                                          {log.details.map((d, i) => (
                                            <span key={i} className={`text-[11px] px-2 py-0.5 rounded font-medium ${isRestock ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                                              {d}
                                            </span>
                                          ))}
                                        </div>
                                      ) : '-'}
                                    </td>
                                    <td className="p-3 text-slate-500 italic text-xs">{log.note || '-'}</td>
                                    <td className="p-3 text-center whitespace-nowrap">
                                      <button
                                        onClick={() => setLogToDelete(log)}
                                        className="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-lg transition text-xs font-bold inline-flex items-center gap-1"
                                        title="ลบรายการนี้"
                                      >
                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> ลบ
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      )}

                    </div>
                  )}
                </>
              )}

            </main>
          </div>

          <footer className="text-center py-5 text-xs text-slate-400 border-t border-slate-200/60 bg-white">
            ร้านติดใจ &copy; ระบบจัดการสต๊อกของ & เติมของ
          </footer>

          {/* Render Modals */}
          <CategoryModal
            isOpen={categoryModalOpen}
            onClose={() => setCategoryModalOpen(false)}
            categories={categories}
            onAddCategory={handleAddCategory}
            onDeleteCategory={handleDeleteCategory}
          />

          <StockModal
            isOpen={stockModalOpen}
            onClose={() => setStockModalOpen(false)}
            onSave={handleSaveStock}
            editingStock={editingStock}
            handleImageUpload={handleImageUpload}
            categories={categories}
            onOpenCategoryModal={() => setCategoryModalOpen(true)}
          />

          <RestockModal
            isOpen={restockModalOpen}
            onClose={() => setRestockModalOpen(false)}
            stocks={stocks}
            categories={categories}
            onConfirmBatchRestock={handleBatchRestock}
          />

          <TransferModal
            isOpen={transferModalOpen}
            onClose={() => setTransferModalOpen(false)}
            stocks={stocks}
            categories={categories}
            onConfirmBatchTransfer={handleBatchTransfer}
          />

          <PrintSummaryModal
            isOpen={printModalOpen}
            onClose={() => setPrintModalOpen(false)}
            logs={logs}
            lowStockItems={lowStockItems}
          />

          <RecipeModal
            isOpen={recipeModalOpen}
            onClose={() => setRecipeModalOpen(false)}
            onSave={handleSaveRecipe}
            editingRecipe={editingRecipe}
            stocks={stocks}
            handleImageUpload={handleImageUpload}
          />

          <DeleteLogModal
            isOpen={!!logToDelete}
            onClose={() => setLogToDelete(null)}
            logToDelete={logToDelete}
            onConfirmDelete={handleConfirmDeleteLog}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

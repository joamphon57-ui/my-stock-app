<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบสต๊อกของร้านติดใจ & เติมของร้านติดใจ (Mobile Edition)</title>
  <meta property="og:title" content="ระบบสต๊อกของ & เติมของ" />
  <meta property="og:description" content="ระบบจัดการสต๊อก คำนวณการปรุง และเติมของประจำวัน" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Barcode / QR Scanner Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    .custom-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-input {
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      color: #0f172a;
      transition: all 0.2s ease-in-out;
    }
    .custom-input:focus {
      background-color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      outline: none;
    }

    /* Target mobile touch optimization */
    input, select, button {
      touch-action: manipulation;
    }

    /* Print Styles */
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyD3wBGAwKShNdgQ9koIOc012Rr7G3PThaQ",
      authDomain: "mystock-9c662.firebaseapp.com",
      projectId: "mystock-9c662",
      storageBucket: "mystock-9c662.firebasestorage.app",
      messagingSenderId: "260845867642",
      appId: "1:260845867642:web:838b08a93178e8d2eae1c3",
      measurementId: "G-J37RQGYDT2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
      if (err.code === 'failed-precondition') {
        console.log('Offline Persistence: มีการเปิดเว็บหลายแท็บพร้อมกัน');
      } else if (err.code === 'unimplemented') {
        console.log('Offline Persistence: เบราว์เซอร์ไม่รองรับ');
      }
    });

    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=150';

    // Helper: Convert Units (Grams/Kg, Ml/Liters)
    const convertUnitToStock = (amount, recipeUnit, stockUnit) => {
      const rUnit = (recipeUnit || '').toLowerCase().trim();
      const sUnit = (stockUnit || '').toLowerCase().trim();

      if (rUnit === sUnit) return amount;
      
      // Grams & Kilograms
      if ((rUnit === 'กรัม' || rUnit === 'g') && (sUnit === 'กิโลกรัม' || sUnit === 'kg')) return amount / 1000;
      if ((rUnit === 'กิโลกรัม' || rUnit === 'kg') && (sUnit === 'กรัม' || sUnit === 'g')) return amount * 1000;

      // ML & Liters
      if ((rUnit === 'มล.' || rUnit === 'ml') && (sUnit === 'ลิตร' || sUnit === 'l')) return amount / 1000;
      if ((rUnit === 'ลิตร' || rUnit === 'l') && (sUnit === 'มล.' || sUnit === 'ml')) return amount * 1000;

      return amount;
    };

    // ==========================================
    // CAMERA BARCODE SCANNER MODAL
    // ==========================================
    function BarcodeScannerModal({ isOpen, onClose, onScanSuccess }) {
      const videoRef = useRef(null);
      const codeReaderRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          const codeReader = new ZXing.BrowserMultiFormatReader();
          codeReaderRef.current = codeReader;

          codeReader.decodeFromVideoDevice(undefined, videoRef.current, (result, err) => {
            if (result) {
              onScanSuccess(result.getText());
              onClose();
            }
          }).catch(err => console.error(err));
        } else {
          if (codeReaderRef.current) {
            codeReaderRef.current.reset();
          }
        }

        return () => {
          if (codeReaderRef.current) {
            codeReaderRef.current.reset();
          }
        };
      }, [isOpen]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl flex flex-col items-center">
            <div className="w-full flex justify-between items-center mb-3">
              <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i data-lucide="scan" className="w-4 h-4 text-emerald-600"></i> สแกนบาร์โค้ดวัตถุดิบ
              </h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>
            <div className="w-full h-56 bg-black rounded-2xl overflow-hidden relative border-2 border-emerald-500">
              <video ref={videoRef} className="w-full h-full object-cover"></video>
            </div>
            <p className="text-[11px] text-slate-400 mt-3 text-center">ส่องบาร์โค้ดให้อยู่ในกรอบเพื่อค้นหาวัตถุดิบอัตโนมัติ</p>
          </div>
        </div>
      );
    }

    // ==========================================
    // 1. MODAL: เพิ่ม/แก้ไข วัตถุดิบ (Stock Modal)
    // ==========================================
    function StockModal({ isOpen, onClose, onSave, editingStock, handleImageUpload }) {
      const [name, setName] = useState('');
      const [category, setCategory] = useState('ชา/กาแฟ');
      const [barcode, setBarcode] = useState('');
      const [categoriesList, setCategoriesList] = useState([
        'ชา/กาแฟ', 'นม/น้ำตาล', 'ไซรัป/ยา', 'ท็อปปิ้ง', 'บรรจุภัณฑ์', 'อื่นๆ'
      ]);
      const [current, setCurrent] = useState('');
      const [unit, setUnit] = useState('กรัม');
      const [minAlert, setMinAlert] = useState('500');
      const [image, setImage] = useState('');
      const [isScannerOpen, setIsScannerOpen] = useState(false);

      useEffect(() => {
        if (editingStock) {
          setName(editingStock.name || '');
          setCategory(editingStock.category || 'ชา/กาแฟ');
          setBarcode(editingStock.barcode || '');
          setCurrent(editingStock.current !== undefined ? editingStock.current : '');
          setUnit(editingStock.unit || 'กรัม');
          setMinAlert(editingStock.minAlert !== undefined ? editingStock.minAlert : '500');
          setImage(editingStock.image || '');

          if (editingStock.category && !categoriesList.includes(editingStock.category)) {
            setCategoriesList(prev => [...prev, editingStock.category]);
          }
        } else {
          setName('');
          setCategory('ชา/กาแฟ');
          setBarcode('');
          setCurrent('');
          setUnit('กรัม');
          setMinAlert('500');
          setImage('');
        }
      }, [editingStock, isOpen]);

      if (!isOpen) return null;

      const handleAddCustomCategory = () => {
        const newCat = prompt("กรุณากรอกชื่อหมวดหมู่ใหม่ที่ต้องการเพิ่ม:");
        if (newCat && newCat.trim() !== '') {
          const trimmed = newCat.trim();
          if (!categoriesList.includes(trimmed)) {
            setCategoriesList(prev => [...prev, trimmed]);
          }
          setCategory(trimmed);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name || current === '') return alert('กรุณากรอกชื่อวัตถุดิบและจำนวนคงเหลือ');
        onSave({
          id: editingStock ? editingStock.id : undefined,
          name,
          category,
          barcode,
          current: Number(current),
          unit,
          minAlert: Number(minAlert),
          image
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <i data-lucide={editingStock ? "edit-3" : "plus-circle"} className="w-5 h-5 text-emerald-600"></i>
                {editingStock ? 'แก้ไขรายการวัตถุดิบ' : 'เพิ่มวัตถุดิบใหม่เข้าระบบ'}
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อวัตถุดิบ <span className="text-rose-500">*</span></label>
                <input type="text" placeholder="เช่น ผงชาไทยตรามือ / ยาชนิด A / ไซรัปส้ม" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">รหัสบาร์โค้ด (Optional)</label>
                <div className="flex space-x-2">
                  <input type="text" placeholder="ยิงบาร์โค้ดที่นี่..." value={barcode} onChange={e => setBarcode(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                  <button type="button" onClick={() => setIsScannerOpen(true)} className="bg-emerald-50 text-emerald-600 px-3 py-2 rounded-xl font-bold border border-emerald-200">
                    <i data-lucide="scan" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="block text-xs font-semibold text-slate-600">หมวดหมู่</label>
                  <button type="button" onClick={handleAddCustomCategory} className="text-[11px] font-bold text-emerald-600 hover:underline">
                    + เพิ่มหมวดหมู่ใหม่
                  </button>
                </div>
                <select value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-3 text-sm rounded-xl custom-input">
                  {categoriesList.map((cat, idx) => (
                    <option key={idx} value={cat}>{cat}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">หน่วยเรียกหลัก <span className="text-rose-500">*</span></label>
                <input type="text" placeholder="เช่น กรัม, มล., ขวด, กิโลกรัม" value={unit} onChange={e => setUnit(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวนปัจจุบัน <span className="text-rose-500">*</span></label>
                  <input type="number" step="any" placeholder="0" value={current} onChange={e => setCurrent(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">จุดเตือนสั่งเพิ่ม (Min Alert)</label>
                  <input type="number" step="any" placeholder="500" value={minAlert} onChange={e => setMinAlert(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">รูปภาพวัตถุดิบ</label>
                <div className="flex items-center space-x-3">
                  <img src={image || DEFAULT_IMAGE} className="w-14 h-14 rounded-xl object-cover border border-slate-200" alt="พรีวิววัตถุดิบ" />
                  <input 
                    type="file" 
                    accept="image/*" 
                    onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} 
                    className="text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" 
                  />
                </div>
              </div>

              <div className="pt-4 flex gap-3">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
                <button type="submit" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition">บันทึกข้อมูล</button>
              </div>
            </form>
          </div>

          <BarcodeScannerModal
            isOpen={isScannerOpen}
            onClose={() => setIsScannerOpen(false)}
            onScanSuccess={(code) => setBarcode(code)}
          />
        </div>
      );
    }

    // ==========================================
    // 2. MODAL: เติมวัตถุดิบเข้าคลัง (Restock Batch Modal)
    // ==========================================
    function RestockModal({ isOpen, onClose, stocks, onConfirmBatchRestock }) {
      const [restockQtyMap, setRestockQtyMap] = useState({});
      const [note, setNote] = useState('');

      useEffect(() => {
        if (isOpen) {
          const initialMap = {};
          stocks.forEach(s => { initialMap[s.id] = ''; });
          setRestockQtyMap(initialMap);
          setNote('เติมวัตถุดิบประจำวัน');
        }
      }, [isOpen, stocks]);

      if (!isOpen) return null;

      const handleQtyChange = (stockId, val) => {
        setRestockQtyMap(prev => ({ ...prev, [stockId]: val }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onConfirmBatchRestock(restockQtyMap, note);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col justify-between">
            <div>
              <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-4">
                <div>
                  <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i data-lucide="plus-circle" className="w-5 h-5 text-emerald-600"></i>
                    📥 เติมวัตถุดิบเข้าคลัง (Restock Batch)
                  </h3>
                  <p className="text-xs text-slate-400 mt-0.5">ใส่จำนวนที่ต้องการเติมลงในช่องของแต่ละวัตถุดิบ</p>
                </div>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form id="restockForm" onSubmit={handleSubmit} className="space-y-4">
                <div className="max-h-[50vh] overflow-y-auto pr-1 space-y-3">
                  {stocks.map(stock => {
                    const isLow = Number(stock.current) <= Number(stock.minAlert || 0);
                    return (
                      <div key={stock.id} className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${isLow ? 'bg-rose-50/50 border-rose-200' : 'bg-slate-50 border-slate-200'}`}>
                        <div className="flex-1 min-w-0 flex items-center gap-3">
                          <img src={stock.image || DEFAULT_IMAGE} className="w-10 h-10 rounded-lg object-cover border" alt={stock.name} />
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-sm text-slate-800 truncate">{stock.name}</span>
                              {isLow && <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded font-bold">ใกล้หมด</span>}
                            </div>
                            <span className="text-xs text-slate-400">ปัจจุบัน: <strong className="text-slate-700">{stock.current}</strong> {stock.unit}</span>
                          </div>
                        </div>
                        <div className="w-36 flex items-center space-x-1.5">
                          <span className="text-xs font-bold text-emerald-600">+</span>
                          <input
                            type="number"
                            step="any"
                            placeholder="0"
                            value={restockQtyMap[stock.id] || ''}
                            onChange={(e) => handleQtyChange(stock.id, e.target.value)}
                            className="w-full px-3 py-2 text-sm text-center font-bold text-emerald-700 bg-white rounded-xl border border-slate-300 focus:border-emerald-500 focus:outline-none"
                          />
                          <span className="text-xs text-slate-400 whitespace-nowrap min-w-[30px]">{stock.unit}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="pt-2">
                  <label className="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุการเติมวัตถุดิบ</label>
                  <input
                    type="text"
                    placeholder="เช่น สั่งซื้อเพิ่มจากซัพพลายเออร์ / แม็คโคร"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    className="w-full px-4 py-2.5 text-sm rounded-xl custom-input"
                  />
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-slate-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
              <button type="submit" form="restockForm" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition">บันทึกการเติมสต๊อก</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. MODAL: ย้ายไปหน้าร้าน (Transfer Modal)
    // ==========================================
    function TransferModal({ isOpen, onClose, stocks, onConfirmTransfer }) {
      const [stockId, setStockId] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [qty, setQty] = useState('');
      const [note, setNote] = useState('');
      const [isScannerOpen, setIsScannerOpen] = useState(false);

      const filteredStocksForTransfer = useMemo(() => {
        return stocks.filter(s => 
          s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (s.category && s.category.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (s.barcode && s.barcode.includes(searchQuery))
        );
      }, [stocks, searchQuery]);

      useEffect(() => {
        if (isOpen && stocks.length > 0) {
          setStockId(stocks[0].id);
          setSearchQuery('');
          setQty('');
          setNote('แบ่งขาย / ตั้งขายหน้าร้าน');
        }
      }, [isOpen, stocks]);

      if (!isOpen) return null;

      const selectedStock = stocks.find(s => s.id === stockId);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!stockId || !qty || Number(qty) <= 0) return alert('กรุณาระบุวัตถุดิบและจำนวนที่ถูกต้อง');
        if (selectedStock && Number(qty) > Number(selectedStock.current)) {
          return alert(`ไม่สามารถย้ายได้ เนื่องจากจำนวนที่ย้ายมากกว่าสต๊อกคงเหลือที่มี (${selectedStock.current} ${selectedStock.unit})`);
        }
        onConfirmTransfer(stockId, Number(qty), note);
      };

      const handleScanBarcode = (scannedCode) => {
        const found = stocks.find(s => s.barcode === scannedCode);
        if (found) {
          setStockId(found.id);
        } else {
          alert('ไม่พบวัตถุดิบที่มีบาร์โค้ดนี้');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
              <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                <i data-lucide="share" className="w-5 h-5 text-amber-600"></i>
                📤 ย้ายวัตถุดิบไปหน้าร้าน
              </h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">🔍 ค้นหาหรือสแกนบาร์โค้ด</label>
                <div className="flex space-x-2 mb-2">
                  <input
                    type="text"
                    placeholder="พิมพ์ชื่อวัตถุดิบ..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-4 py-2 text-xs rounded-xl custom-input"
                  />
                  <button type="button" onClick={() => setIsScannerOpen(true)} className="bg-amber-50 text-amber-600 px-3 py-2 rounded-xl border border-amber-200 font-bold">
                    <i data-lucide="scan" className="w-4 h-4"></i>
                  </button>
                </div>

                <label className="block text-xs font-semibold text-slate-600 mb-1">เลือกวัตถุดิบ / ยา / ไซรัป <span className="text-rose-500">*</span></label>
                <select value={stockId} onChange={e => setStockId(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input font-medium">
                  {filteredStocksForTransfer.map(s => (
                    <option key={s.id} value={s.id}>{s.name} (คงเหลือ: {s.current} {s.unit})</option>
                  ))}
                  {filteredStocksForTransfer.length === 0 && (
                    <option value="" disabled>ไม่พบวัตถุดิบที่ค้นหา</option>
                  )}
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวนที่ต้องการย้ายออกไปหน้าร้าน <span className="text-rose-500">*</span></label>
                <div className="flex items-center space-x-2">
                  <input
                    type="number"
                    step="any"
                    placeholder="0"
                    value={qty}
                    onChange={e => setQty(e.target.value)}
                    required
                    className="w-full px-4 py-3 text-sm rounded-xl custom-input font-bold text-center text-amber-700"
                  />
                  <span className="text-xs font-bold text-slate-500 min-w-[40px]">{selectedStock ? selectedStock.unit : ''}</span>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุ</label>
                <input
                  type="text"
                  placeholder="เช่น ย้ายยาแบ่งขาย 50 เม็ด / ไซรัป 2 ขวด"
                  value={note}
                  onChange={e => setNote(e.target.value)}
                  className="w-full px-4 py-2.5 text-sm rounded-xl custom-input"
                />
              </div>

              <div className="pt-4 flex gap-3">
                <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
                <button type="submit" className="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-amber-500/20 transition">ยืนยันการย้าย</button>
              </div>
            </form>
          </div>

          <BarcodeScannerModal
            isOpen={isScannerOpen}
            onClose={() => setIsScannerOpen(false)}
            onScanSuccess={handleScanBarcode}
          />
        </div>
      );
    }

    // ==========================================
    // 4. MODAL: สรุปรายงานประจำวัน & สั่งพิมพ์ (Print Summary Modal)
    // ==========================================
    function PrintSummaryModal({ isOpen, onClose, logs, lowStockItems }) {
      if (!isOpen) return null;

      const todayStr = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });

      const todayLogs = logs.filter(l => {
        if (!l.datetime) return false;
        const now = new Date();
        const d = now.getDate().toString().padStart(2, '0');
        const m = (now.getMonth() + 1).toString().padStart(2, '0');
        const y = now.getFullYear() + 543;
        return l.datetime.includes(`${d}/${m}/${y}`);
      });

      const productionLogs = todayLogs.filter(l => l.type === 'ต้มผลิต');
      let totalPots = 0;
      const recipeSummary = {};

      productionLogs.forEach(l => {
        if (l.title) {
          const items = l.title.replace('ต้ม ', '').split(', ');
          items.forEach(item => {
            const match = item.match(/(.+) \((\d+) หม้อ\)/);
            if (match) {
              const name = match[1].trim();
              const count = parseInt(match[2], 10);
              recipeSummary[name] = (recipeSummary[name] || 0) + count;
              totalPots += count;
            }
          });
        }
      });

      const transferLogs = todayLogs.filter(l => l.type === 'ย้ายไปหน้าร้าน');

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col justify-between">
            <div id="printable-report" className="overflow-y-auto pr-1">
              <div className="border-b-2 border-slate-800 pb-4 mb-6 flex justify-between items-end">
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-900">📄 สรุปรายงานประจำวัน</h1>
                  <p className="text-xs font-semibold text-slate-500 mt-1">วันที่: {todayStr}</p>
                </div>
                <div className="text-right text-[11px] text-slate-400">
                  Beverage Stock Pro
                </div>
              </div>

              <div className="mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    🍵 สรุปการต้มน้ำชาประจำวัน
                  </h3>
                  <span className="text-xs font-extrabold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                    รวม {totalPots} หม้อ
                  </span>
                </div>

                {Object.keys(recipeSummary).length === 0 ? (
                  <div className="text-xs text-slate-400 italic">ยังไม่มีบันทึกการต้มชาในวันนี้</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    {Object.entries(recipeSummary).map(([name, count]) => (
                      <div key={name} className="bg-white p-2.5 rounded-xl border border-slate-200 flex justify-between items-center">
                        <span className="font-semibold text-slate-700">{name}</span>
                        <span className="font-bold text-emerald-600">{count} หม้อ</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="mb-6 bg-rose-50/60 p-4 rounded-2xl border border-rose-200">
                <h3 className="font-bold text-rose-800 text-sm mb-3 flex items-center gap-1.5">
                  ⚠️ วัตถุดิบใกล้หมด / ต้องสั่งซื้อเพิ่ม ({lowStockItems.length} รายการ)
                </h3>

                {lowStockItems.length === 0 ? (
                  <div className="text-xs text-slate-500 italic">ไม่มีวัตถุดิบใกล้หมด สต๊อกอยู่ในเกณฑ์ปกติ</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    {lowStockItems.map(s => (
                      <div key={s.id} className="bg-white p-2.5 rounded-xl border border-rose-200 flex justify-between items-center">
                        <span className="font-semibold text-slate-800">{s.name}</span>
                        <span className="font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded">
                          เหลือ {s.current} {s.unit}
                        </span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="mb-4 bg-amber-50/60 p-4 rounded-2xl border border-amber-200">
                <h3 className="font-bold text-amber-900 text-sm mb-3 flex items-center gap-1.5">
                  📤 สรุปการย้ายวัตถุดิบไปหน้าร้านวันนี้
                </h3>

                {transferLogs.length === 0 ? (
                  <div className="text-xs text-slate-500 italic">ไม่มีรายการย้ายไปหน้าร้านในวันนี้</div>
                ) : (
                  <div className="space-y-2 text-xs">
                    {transferLogs.map(l => (
                      <div key={l.id} className="bg-white p-2.5 rounded-xl border border-amber-200 flex justify-between items-center">
                        <span className="font-semibold text-slate-800">{l.title}</span>
                        <span className="text-slate-500 text-[10px] sm:text-xs">{l.datetime}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

            </div>

            <div className="pt-4 border-t border-slate-100 flex gap-3 mt-4 no-print">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">
                ปิดหน้าต่าง
              </button>
              <button type="button" onClick={handlePrint} className="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm rounded-xl shadow-lg shadow-slate-900/20 transition flex items-center justify-center gap-2">
                <i data-lucide="printer" className="w-4 h-4"></i> พิมพ์ / PDF
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. MODAL: เพิ่ม/แก้ไข สูตรเครื่องดื่ม (BOM Modal)
    // ==========================================
    function RecipeModal({ isOpen, onClose, onSave, editingRecipe, stocks, handleImageUpload }) {
      const [name, setName] = useState('');
      const [yieldInfo, setYieldInfo] = useState('1 หม้อ (ประมาณ 5 ลิตร)');
      const [image, setImage] = useState('');
      const [ingredients, setIngredients] = useState([]);

      useEffect(() => {
        if (editingRecipe) {
          setName(editingRecipe.name || '');
          setYieldInfo(editingRecipe.yieldInfo || '1 หม้อ');
          setImage(editingRecipe.image || '');
          setIngredients(editingRecipe.ingredients || []);
        } else {
          setName('');
          setYieldInfo('1 หม้อ (ประมาณ 5 ลิตร)');
          setImage('');
          setIngredients([]);
        }
      }, [editingRecipe, isOpen]);

      if (!isOpen) return null;

      const handleAddIngredient = () => {
        if (stocks.length === 0) return alert('กรุณาเพิ่มวัตถุดิบในคลังก่อนสร้างสูตร');
        const defaultStock = stocks[0];
        setIngredients(prev => [...prev, { stockId: defaultStock.id, amount: '', unit: defaultStock.unit || 'กรัม' }]);
      };

      const handleRemoveIngredient = (index) => {
        setIngredients(prev => prev.filter((_, i) => i !== index));
      };

      const handleIngredientChange = (index, field, value) => {
        setIngredients(prev => {
          const updated = [...prev];
          if (field === 'stockId') {
            const selectedStock = stocks.find(s => s.id === value);
            updated[index] = { 
              ...updated[index], 
              stockId: value, 
              unit: selectedStock ? selectedStock.unit : 'กรัม' 
            };
          } else {
            updated[index] = { ...updated[index], [field]: value };
          }
          return updated;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name) return alert('กรุณาระบุชื่อสูตรเครื่องดื่ม');
        if (ingredients.length === 0) return alert('กรุณาเพิ่มส่วนผสมอย่างน้อย 1 รายการ');

        for (let ing of ingredients) {
          if (!ing.stockId || !ing.amount || Number(ing.amount) <= 0) {
            return alert('กรุณากรอกปริมาณส่วนผสมให้ครบถ้วนและถูกต้อง');
          }
        }

        onSave({
          id: editingRecipe ? editingRecipe.id : undefined,
          name,
          yieldInfo,
          image,
          ingredients: ingredients.map(i => ({ 
            stockId: i.stockId, 
            amount: Number(i.amount),
            unit: i.unit || 'กรัม'
          }))
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] flex flex-col justify-between">
            <div className="overflow-y-auto pr-1">
              <div className="flex justify-between items-center pb-4 border-b border-slate-100 mb-5">
                <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                  <i data-lucide={editingRecipe ? "edit-3" : "book-open"} className="w-5 h-5 text-emerald-600"></i>
                  {editingRecipe ? 'แก้ไขสูตรเครื่องดื่ม' : 'เพิ่มสูตรเครื่องดื่มใหม่ (BOM)'}
                </h3>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>

              <form id="recipeForm" onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อสูตร / เครื่องดื่ม <span className="text-rose-500">*</span></label>
                  <input type="text" placeholder="เช่น ชาไทยสูตรต้ม 5 ลิตร" value={name} onChange={e => setName(e.target.value)} required className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">ปริมาณที่ได้ต่อ 1 บัตช์ / หม้อ</label>
                  <input type="text" placeholder="เช่น 1 หม้อ (ประมาณ 5 ลิตร / 25 แก้ว)" value={yieldInfo} onChange={e => setYieldInfo(e.target.value)} className="w-full px-4 py-2.5 text-sm rounded-xl custom-input" />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">รูปภาพประกอบ</label>
                  <div className="flex items-center space-x-3">
                    <img src={image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border border-slate-200" alt="พรีวิวสูตร" />
                    <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, (base64) => setImage(base64))} className="text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
                  </div>
                </div>

                <div className="pt-2 border-t border-slate-100">
                  <div className="flex justify-between items-center mb-3">
                    <label className="text-xs font-bold text-slate-700">รายการส่วนผสม (ต่อ 1 หม้อ) <span className="text-rose-500">*</span></label>
                    <button type="button" onClick={handleAddIngredient} className="text-xs font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg flex items-center gap-1">
                      <i data-lucide="plus" className="w-3.5 h-3.5"></i> เพิ่มวัตถุดิบ
                    </button>
                  </div>

                  {ingredients.length === 0 ? (
                    <div className="text-center py-6 border-2 border-dashed border-slate-200 rounded-2xl text-xs text-slate-400">
                      ยังไม่มีส่วนผสม กดปุ่ม "+ เพิ่มวัตถุดิบ" ด้านบนเพื่อระบุส่วนผสม
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {ingredients.map((ing, idx) => {
                        return (
                          <div key={idx} className="flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                            <select
                              value={ing.stockId}
                              onChange={(e) => handleIngredientChange(idx, 'stockId', e.target.value)}
                              className="flex-1 px-2.5 py-2 text-xs rounded-lg custom-input font-medium"
                            >
                              {stocks.map(s => (
                                <option key={s.id} value={s.id}>{s.name}</option>
                              ))}
                            </select>

                            <input
                              type="number"
                              step="any"
                              placeholder="จำนวน"
                              value={ing.amount}
                              onChange={(e) => handleIngredientChange(idx, 'amount', e.target.value)}
                              className="w-20 px-2 py-2 text-xs rounded-lg custom-input font-bold text-center"
                            />

                            <input
                              type="text"
                              placeholder="หน่วย"
                              value={ing.unit || ''}
                              onChange={(e) => handleIngredientChange(idx, 'unit', e.target.value)}
                              className="w-16 px-2 py-2 text-xs rounded-lg custom-input text-center"
                            />

                            <button type="button" onClick={() => handleRemoveIngredient(idx)} className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </form>
            </div>

            <div className="pt-4 border-t border-slate-100 flex gap-3 mt-4">
              <button type="button" onClick={onClose} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-sm rounded-xl transition">ยกเลิก</button>
              <button type="submit" form="recipeForm" className="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/20 transition">บันทึกสูตร</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState('production');
      const [stocks, setStocks] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);

      // Search & Filter States
      const [searchProduction, setSearchProduction] = useState('');
      const [searchStock, setSearchStock] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all'); // เพิ่ม State หมวดหมู่
      const [searchRecipe, setSearchRecipe] = useState('');
      const [searchHistory, setSearchHistory] = useState('');

      const [batchQuantities, setBatchQuantities] = useState({});
      const [productionNote, setProductionNote] = useState('');

      // Modals
      const [stockModalOpen, setStockModalOpen] = useState(false);
      const [editingStock, setEditingStock] = useState(null);

      const [restockModalOpen, setRestockModalOpen] = useState(false);
      const [transferModalOpen, setTransferModalOpen] = useState(false);
      const [printModalOpen, setPrintModalOpen] = useState(false);

      const [recipeModalOpen, setRecipeModalOpen] = useState(false);
      const [editingRecipe, setEditingRecipe] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // --- Firebase Listener ---
      useEffect(() => {
        const unsubStocks = db.collection('stocks').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setStocks(data);
          setLoading(false);
        }, err => console.error("Error stocks:", err));

        const unsubRecipes = db.collection('recipes').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setRecipes(data);
        }, err => console.error("Error recipes:", err));

        const unsubLogs = db.collection('logs').onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => {
            const docData = doc.data();
            return {
              id: doc.id,
              ...docData,
              createdTime: docData.timestamp ? docData.timestamp.toMillis() : Date.now()
            };
          });
          data.sort((a, b) => b.createdTime - a.createdTime);
          setLogs(data);
        }, err => console.error("Error logs:", err));

        return () => {
          unsubStocks();
          unsubRecipes();
          unsubLogs();
        };
      }, []);

      // ดึงรายชื่อหมวดหมู่ทั้งหมดที่มีในสต๊อกแบบไดนามิก
      const availableCategories = useMemo(() => {
        const defaultCats = ['ชา/กาแฟ', 'นม/น้ำตาล', 'ไซรัป/ยา', 'ท็อปปิ้ง', 'บรรจุภัณฑ์', 'อื่นๆ'];
        const stockCats = stocks.map(s => s.category).filter(Boolean);
        return Array.from(new Set([...defaultCats, ...stockCats]));
      }, [stocks]);

      // Filtered Lists
      const filteredProductionRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchProduction.toLowerCase()));
      }, [recipes, searchProduction]);

      // ระบบ กรองตามคำค้นหา + หมวดหมู่ที่เลือก
      const filteredStocks = useMemo(() => {
        return stocks.filter(s => {
          const matchSearch = s.name.toLowerCase().includes(searchStock.toLowerCase()) || 
                             (s.category && s.category.toLowerCase().includes(searchStock.toLowerCase())) ||
                             (s.barcode && s.barcode.includes(searchStock));
          
          const matchCategory = selectedCategory === 'all' || s.category === selectedCategory;

          return matchSearch && matchCategory;
        });
      }, [stocks, searchStock, selectedCategory]);

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => r.name.toLowerCase().includes(searchRecipe.toLowerCase()));
      }, [recipes, searchRecipe]);

      const filteredLogs = useMemo(() => {
        return logs.filter(l => 
          (l.title && l.title.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.type && l.type.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (l.note && l.note.toLowerCase().includes(searchHistory.toLowerCase())) ||
          (Array.isArray(l.details) && l.details.some(d => d.toLowerCase().includes(searchHistory.toLowerCase())))
        );
      }, [logs, searchHistory]);

      const lowStockItems = useMemo(() => {
        return stocks.filter(item => {
          const currentVal = Number(item.current) || 0;
          const minVal = Number(item.minAlert) || 0;
          return currentVal <= minVal;
        });
      }, [stocks]);

      // Helper: Image Upload
      const handleImageUpload = (e, callback) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 1.2 * 1024 * 1024) {
            alert("รูปภาพมีขนาดใหญ่เกินไป กรุณาใช้รูปขนาดไม่เกิน 1.2MB ครับ");
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => callback(reader.result);
          reader.readAsDataURL(file);
        }
      };

      // --- Production Handlers ---
      const handleQuantityChange = (recipeId, delta) => {
        setBatchQuantities(prev => {
          const current = prev[recipeId] || 0;
          const updated = Math.max(0, current + delta);
          return { ...prev, [recipeId]: updated };
        });
      };

      const selectedProductionList = useMemo(() => {
        return Object.entries(batchQuantities)
          .filter(([_, qty]) => qty > 0)
          .map(([recipeId, qty]) => {
            const recipe = recipes.find(r => r.id === recipeId);
            return {
              recipeId,
              name: recipe ? recipe.name : 'สูตรเครื่องดื่ม',
              qty,
              yieldInfo: recipe ? recipe.yieldInfo : '',
              recipe
            };
          });
      }, [batchQuantities, recipes]);

      const handleConfirmProduction = async () => {
        if (selectedProductionList.length === 0) return alert('กรุณาเลือกจำนวนหม้ออย่างน้อย 1 รายการ');

        try {
          const batch = db.batch();

          const deductionsSummary = {};
          selectedProductionList.forEach(item => {
            if (item.recipe && item.recipe.ingredients) {
              item.recipe.ingredients.forEach(ing => {
                const stockItem = stocks.find(s => s.id === ing.stockId);
                if (stockItem) {
                  const rawAmount = Number(ing.amount) * item.qty;
                  const convertedAmount = convertUnitToStock(rawAmount, ing.unit, stockItem.unit);
                  deductionsSummary[ing.stockId] = (deductionsSummary[ing.stockId] || 0) + convertedAmount;
                }
              });
            }
          });

          Object.entries(deductionsSummary).forEach(([stockId, deductAmount]) => {
            const stockRef = db.collection('stocks').doc(stockId);
            batch.update(stockRef, {
              current: firebase.firestore.FieldValue.increment(-deductAmount)
            });
          });

          const titleText = selectedProductionList.map(item => `${item.name} (${item.qty} หม้อ)`).join(', ');
          
          const detailsList = Object.entries(deductionsSummary).map(([stockId, deductAmount]) => {
            const stockItem = stocks.find(s => s.id === stockId);
            return `${stockItem ? stockItem.name : 'วัตถุดิบ'}: -${deductAmount.toFixed(2)} ${stockItem ? stockItem.unit : ''}`;
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${year} ${hours}:${mins} น.`;

          const logRef = db.collection('logs').doc();
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'ต้มผลิต',
            title: `ต้ม ${titleText}`,
            details: detailsList,
            note: productionNote || 'ต้มผลิตประจำวัน'
          });

          await batch.commit();
          alert('บันทึกการผลิตและตัดสต๊อกเรียบร้อยแล้ว!');
          setBatchQuantities({});
          setProductionNote('');
        } catch (error) {
          console.error("Error confirming production:", error);
          alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
        }
      };

      // --- History Handlers ---
      const handleClearLogs = async () => {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการ "ล้างประวัติย้อนหลังทั้งหมด"?')) {
          try {
            const snapshot = await db.collection('logs').get();
            const batch = db.batch();
            snapshot.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert('ล้างประวัติเรียบร้อยแล้ว');
          } catch(e) {
            alert("เกิดข้อผิดพลาดในการล้างประวัติ");
          }
        }
      };

      // --- Stock Handlers ---
      const handleDeleteStock = async (id) => {
        if (confirm('คุณต้องการลบวัตถุดิบรายการนี้ใช่หรือไม่?')) {
          await db.collection('stocks').doc(id).delete();
        }
      };

      const handleSaveStock = async (stockData) => {
        try {
          if (stockData.id) {
            const id = stockData.id;
            delete stockData.id;
            await db.collection('stocks').doc(id).update(stockData);
          } else {
            delete stockData.id;
            await db.collection('stocks').add(stockData);
          }
          setStockModalOpen(false);
          alert('บันทึกข้อมูลวัตถุดิบเรียบร้อยแล้ว');
        } catch (err) {
          console.error("Error saving stock:", err);
          alert("ไม่สามารถบันทึกวัตถุดิบได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      // --- Restock Handlers ---
      const handleBatchRestock = async (restockItemsMap, globalNote) => {
        try {
          const itemsToProcess = Object.entries(restockItemsMap).filter(([_, qty]) => Number(qty) > 0);
          if (itemsToProcess.length === 0) return alert('กรุณาระบุจำนวนวัตถุดิบที่ต้องการเติมอย่างน้อย 1 รายการ');

          const batch = db.batch();
          const detailsList = [];

          itemsToProcess.forEach(([stockId, qty]) => {
            const stockItem = stocks.find(s => s.id === stockId);
            const amount = Number(qty);
            if (stockItem && amount > 0) {
              const stockRef = db.collection('stocks').doc(stockId);
              batch.update(stockRef, {
                current: firebase.firestore.FieldValue.increment(amount)
              });
              detailsList.push(`${stockItem.name}: +${amount} ${stockItem.unit}`);
            }
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${year} ${hours}:${mins} น.`;

          const logRef = db.collection('logs').doc();
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'เติมสต๊อก',
            title: `เติมวัตถุดิบเข้าคลัง (${itemsToProcess.length} รายการ)`,
            details: detailsList,
            note: globalNote || 'เติมวัตถุดิบประจำวัน'
          });

          await batch.commit();
          setRestockModalOpen(false);
          alert(`เติมสต๊อกเรียบร้อยแล้วทั้งหมด ${itemsToProcess.length} รายการ!`);
        } catch (err) {
          console.error("Batch Restock error:", err);
          alert("เกิดข้อผิดพลาดในการเติมสต๊อก");
        }
      };

      // --- Transfer to Storefront Handler ---
      const handleTransferToStorefront = async (stockId, qty, note) => {
        try {
          const stockItem = stocks.find(s => s.id === stockId);
          if (!stockItem) return;

          const batch = db.batch();
          const stockRef = db.collection('stocks').doc(stockId);

          batch.update(stockRef, {
            current: firebase.firestore.FieldValue.increment(-qty)
          });

          const now = new Date();
          const day = now.getDate().toString().padStart(2, '0');
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const year = now.getFullYear() + 543;
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${day}/${month}/${year} ${hours}:${mins} น.`;

          const logRef = db.collection('logs').doc();
          batch.set(logRef, {
            datetime: timeStr,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            type: 'ย้ายไปหน้าร้าน',
            title: `ย้าย ${stockItem.name} (${qty} ${stockItem.unit}) ออกไปหน้าร้าน`,
            details: [`${stockItem.name}: -${qty} ${stockItem.unit}`],
            note: note || 'ย้ายไปตั้งขายหน้าร้าน'
          });

          await batch.commit();
          setTransferModalOpen(false);
          alert(`ย้าย ${stockItem.name} ออกไปหน้าร้านเรียบร้อยแล้ว!`);
        } catch (err) {
          console.error("Transfer error:", err);
          alert("เกิดข้อผิดพลาดในการย้ายวัตถุดิบ");
        }
      };

      // --- BOM Handlers ---
      const handleDeleteRecipe = async (id) => {
        if (confirm('คุณต้องการลบสูตรเครื่องดื่มนี้ใช่หรือไม่?')) {
          await db.collection('recipes').doc(id).delete();
        }
      };

      const handleSaveRecipe = async (recipeObj) => {
        try {
          if (recipeObj.id) {
            const id = recipeObj.id;
            delete recipeObj.id;
            await db.collection('recipes').doc(id).update(recipeObj);
          } else {
            delete recipeObj.id;
            await db.collection('recipes').add(recipeObj);
          }
          setRecipeModalOpen(false);
          alert('บันทึกสูตรเรียบร้อยแล้ว');
        } catch (err) {
          console.error("Error saving recipe:", err);
          alert("ไม่สามารถบันทึกสูตรได้ กรุณาลองใหม่อีกครั้ง");
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Header & Navbar */}
            <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between border-b border-slate-100 sm:border-none">
                <div className="flex items-center space-x-2.5">
                  <div className="bg-emerald-500 text-white p-2 rounded-xl shadow-md shadow-emerald-500/20">
                    <i data-lucide="cup-soda" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                  </div>
                  <div>
                    <h1 className="font-bold text-slate-800 text-base sm:text-lg tracking-tight leading-none">ร้านติดใจ</h1>
                    <p className="text-[10px] text-slate-400 font-medium mt-0.5">ระบบจัดการวัตถุดิบ & สต๊อก</p>
                  </div>
                </div>

                <div className="flex items-center space-x-1.5 sm:space-x-2">
                  <button onClick={() => setPrintModalOpen(true)} className="bg-slate-900 text-white hover:bg-slate-800 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-md transition">
                    <i data-lucide="printer" className="w-3.5 h-3.5 sm:w-4 sm:h-4"></i>
                    <span className="hidden sm:inline">สรุปรายงานประจำวัน</span>
                  </button>

                  {lowStockItems.length > 0 && (
                    <button onClick={() => setActiveTab('stock')} className="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-bold px-2.5 py-2 rounded-xl flex items-center gap-1 animate-pulse">
                      <i data-lucide="bell" className="w-3.5 h-3.5"></i>
                      <span>({lowStockItems.length})</span>
                    </button>
                  )}
                </div>
              </div>

              <div className="bg-slate-100/80 p-1.5 border-t border-slate-200/60">
                <div className="max-w-7xl mx-auto flex space-x-1 overflow-x-auto no-scrollbar justify-start sm:justify-center px-2">
                  <button onClick={() => setActiveTab('production')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'production' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="flame" className="w-4 h-4"></i>
                    <span>บันทึกการผลิต</span>
                  </button>

                  <button onClick={() => setActiveTab('stock')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap relative ${activeTab === 'stock' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="boxes" className="w-4 h-4"></i>
                    <span>คลังวัตถุดิบ</span>
                    {lowStockItems.length > 0 && (
                      <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                    )}
                  </button>

                  <button onClick={() => setActiveTab('bom')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'bom' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="book-open" className="w-4 h-4"></i>
                    <span>สูตรการผลิต (BOM)</span>
                  </button>

                  <button onClick={() => setActiveTab('history')} className={`flex items-center space-x-1.5 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${activeTab === 'history' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900'}`}>
                    <i data-lucide="history" className="w-4 h-4"></i>
                    <span>ประวัติย้อนหลัง</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content Body */}
            <main className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 my-4 sm:my-6">

              {loading ? (
                <div className="text-center py-20 text-slate-400 font-medium text-sm">กำลังโหลดข้อมูลระบบ...</div>
              ) : (
                <>
                  {/* ================= TAB 1: บันทึกการผลิต ================= */}
                  {activeTab === 'production' && (
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      
                      <div className="lg:col-span-7 bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                        <div className="mb-4 sm:mb-6">
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📝</span> บันทึกต้มน้ำชาประจำวัน
                          </h2>
                          <p className="text-xs text-slate-400 mt-1">กดเพิ่ม/ลดจำนวนหม้อต้มที่การ์ดเมนู เพื่อสรุปรายการต้มอัตโนมัติ</p>
                        </div>

                        <div className="mb-4 relative">
                          <input
                            type="text"
                            placeholder="ค้นหาชื่อสูตร / เมนูต้มชา..."
                            value={searchProduction}
                            onChange={(e) => setSearchProduction(e.target.value)}
                            className="w-full px-4 py-3 text-xs sm:text-sm rounded-xl custom-input pl-10"
                          />
                          <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                          {searchProduction && (
                            <button onClick={() => setSearchProduction('')} className="absolute right-3 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                          )}
                        </div>

                        {filteredProductionRecipes.length === 0 ? (
                          <div className="text-center py-12 text-slate-400 text-sm">ไม่พบสูตรเครื่องดื่มที่ตรงกับการค้นหา</div>
                        ) : (
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 mb-6">
                            {filteredProductionRecipes.map(recipe => {
                              const qty = batchQuantities[recipe.id] || 0;
                              const isSelected = qty > 0;
                              return (
                                <div key={recipe.id} className={`border-2 rounded-2xl p-3.5 sm:p-4 transition-all duration-200 relative flex flex-col justify-between ${isSelected ? 'border-emerald-500 bg-emerald-50/20' : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                                  
                                  {isSelected && (
                                    <div className="absolute top-3 right-3 bg-emerald-500 text-white rounded-full p-0.5">
                                      <i data-lucide="check" className="w-3.5 h-3.5"></i>
                                    </div>
                                  )}

                                  <div className="flex items-center space-x-3 mb-3">
                                    <img src={recipe.image || DEFAULT_IMAGE} className="w-14 h-14 rounded-2xl object-cover border border-slate-200 shadow-sm" alt={recipe.name} />
                                    <div>
                                      <h3 className="font-bold text-slate-800 text-sm sm:text-base">{recipe.name}</h3>
                                      <p className="text-[11px] text-slate-400">{recipe.yieldInfo}</p>
                                    </div>
                                  </div>

                                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-1 flex items-center justify-between">
                                    <button onClick={() => handleQuantityChange(recipe.id, -1)} className="w-10 h-10 rounded-lg bg-white border border-slate-300 font-bold text-lg text-slate-700 hover:bg-slate-100 active:scale-95 transition flex items-center justify-center shadow-sm">
                                      -
                                    </button>
                                    <div className="text-center">
                                      <span className="font-bold text-base sm:text-lg text-slate-800">{qty}</span>
                                      <span className="text-[9px] text-slate-400 block -mt-1 font-medium">หม้อ / ถัง</span>
                                    </div>
                                    <button onClick={() => handleQuantityChange(recipe.id, 1)} className="w-10 h-10 rounded-lg bg-emerald-500 font-bold text-lg text-white hover:bg-emerald-600 active:scale-95 transition flex items-center justify-center shadow-md shadow-emerald-500/20">
                                      +
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}

                        <div className="mt-4">
                          <label className="block text-xs font-semibold text-slate-600 mb-1.5">หมายเหตุ / ชื่อผู้ต้ม</label>
                          <input type="text" placeholder="เช่น ต้มรอบเช้า โดย ช่างต้มเอ" value={productionNote} onChange={(e) => setProductionNote(e.target.value)} className="w-full px-4 py-3 text-sm rounded-xl custom-input" />
                        </div>
                      </div>

                      <div className="lg:col-span-5">
                        <div className="bg-[#0b1329] text-white rounded-3xl p-5 sm:p-8 shadow-2xl sticky top-28 border border-slate-800">
                          <div className="flex items-center gap-3 pb-4 border-b border-slate-800/80 mb-4 sm:mb-6">
                            <div className="bg-emerald-500/10 p-2 rounded-xl text-emerald-400">
                              <i data-lucide="clipboard-list" className="w-5 h-5 sm:w-6 sm:h-6"></i>
                            </div>
                            <div>
                              <h2 className="font-bold text-base sm:text-lg text-white">สรุปรายการผลิตประจำวัน</h2>
                              <p className="text-[11px] text-slate-400">รายการต้มชาที่เลือกต้มในรอบนี้</p>
                            </div>
                          </div>

                          <div className="space-y-2.5 min-h-[140px] max-h-[300px] overflow-y-auto pr-1">
                            {selectedProductionList.length === 0 ? (
                              <div className="text-center py-10 text-slate-500 text-xs sm:text-sm font-medium">ยังไม่มีรายการที่เลือก<br/><span className="text-[10px] text-slate-600">กดปุ่ม + ด้านซ้ายเพื่อเลือกรายการต้ม</span></div>
                            ) : (
                              selectedProductionList.map(item => (
                                <div key={item.recipeId} className="bg-[#131c38] border border-slate-800/80 rounded-2xl p-3 flex justify-between items-center">
                                  <div className="flex items-center space-x-2.5">
                                    <img src={item.recipe?.image || DEFAULT_IMAGE} className="w-10 h-10 rounded-xl object-cover border border-slate-700" alt={item.name} />
                                    <div>
                                      <div className="font-bold text-xs sm:text-sm text-white">{item.name}</div>
                                      <div className="text-[10px] text-slate-400">{item.yieldInfo}</div>
                                    </div>
                                  </div>
                                  <div className="text-right">
                                    <div className="text-emerald-400 font-extrabold text-base sm:text-lg">{item.qty} หม้อ</div>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>

                          <button onClick={handleConfirmProduction} disabled={selectedProductionList.length === 0} className={`w-full mt-5 py-3.5 sm:py-4 rounded-2xl font-bold text-sm sm:text-base transition-all duration-200 flex items-center justify-center gap-2 ${selectedProductionList.length > 0 ? 'bg-emerald-500 text-slate-950 hover:bg-emerald-400 shadow-lg shadow-emerald-500/20 active:scale-98' : 'bg-slate-800/60 text-slate-500 cursor-not-allowed'}`}>
                            <i data-lucide="check-circle" className="w-5 h-5"></i>
                            ยืนยันการต้ม & ตัดสต๊อกทันที
                          </button>
                        </div>
                      </div>

                    </div>
                  )}

                  {/* ================= TAB 2: คลังวัตถุดิบ ================= */}
                  {activeTab === 'stock' && (
                    <div className="bg-white rounded-3xl p-4 sm:p-8 border border-slate-200/80 custom-shadow">
                      
                      {lowStockItems.length > 0 && (
                        <div className="mb-6 sm:mb-8 bg-rose-50 border-2 border-rose-300 rounded-2xl p-4 sm:p-5 text-rose-900 shadow-sm">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div className="flex items-center space-x-2 font-bold text-sm sm:text-base text-rose-700">
                              <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-600 animate-bounce"></i>
                              <span>เตือนการสั่งซื้อ: วัตถุดิบใกล้หมดคลัง ({lowStockItems.length} รายการ)</span>
                            </div>
                            <button onClick={() => setRestockModalOpen(true)} className="bg-rose-600 text-white font-bold text-xs px-3.5 py-2 rounded-xl hover:bg-rose-700 transition shadow-md w-full sm:w-auto text-center">
                              📥 เติมสต๊อกทันที
                            </button>
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                            {lowStockItems.map(item => (
                              <div key={item.id} className="bg-white p-2.5 rounded-xl border border-rose-200 flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                  <img src={item.image || DEFAULT_IMAGE} className="w-8 h-8 rounded-md object-cover" alt={item.name} />
                                  <span className="font-bold text-xs sm:text-sm text-slate-800">{item.name}</span>
                                </div>
                                <span className="text-[11px] font-bold text-rose-600 bg-rose-100 px-2 py-0.5 rounded-lg">
                                  เหลือ {item.current} {item.unit}
                                </span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-5 pb-5 border-b border-slate-100">
                        <div>
                          <h2 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                            <span>📦</span> คลังวัตถุดิบคงเหลือ (Real-time Stock)
                          </h2>
                          <p className="text-xs text-slate-400 mt-0.5">จัดการข้อมูลสต๊อก เติมสต๊อก หรือย้ายไปหน้าร้าน</p>
                        </div>
                        
                        <div className="grid grid-cols-3 gap-2 sm:flex sm:items-center">
                          <button onClick={() => setTransferModalOpen(true)} className="bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs px-3 py-2.5 rounded-xl transition shadow-md shadow-amber-500/20 flex items-center justify-center gap-1">
                            <i data-lucide="share" className="w-3.5 h-3.5"></i> ย้ายออก
                          </button>

                          <button onClick={() => setRestockModalOpen(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-3 py-2.5 rounded-xl transition shadow-md shadow-emerald-600/20 flex items-center justify-center gap-1">
                            <i data-lucide="plus-circle" className="w-3.5 h-3.5"></i> เติมสต๊อก
                          </button>
                          
                          <button onClick={() => { setEditingStock(null); setStockModalOpen(true); }} className="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-3 py-2.5 rounded-xl transition shadow-md shadow-slate-800/20 flex items-center justify-center gap-1">
                            <i data-lucide="plus" className="w-3.5 h-3.5"></i> เพิ่มใหม่
                          </button>
                        </div>
                      </div>

                      {/* --- ส่วนค้นหา & ปุ่มกดเลือกหมวดหมู่ (Category Filter) --- */}
                      <div className="space-y-3 mb-5">
                        <div className="relative">
                          <input
                            type="text"
                            placeholder="ค้นหาวัตถุดิบ หรือสแกนบาร์โค้ด..."
                            value={searchStock}
                            onChange={(e) => setSearchStock(e.target.value)}
                            className="w-full px-4 py-3 text-xs sm:text-sm rounded-2xl custom-input pl-10"
                          />
                          <span className="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
                          {searchStock && (
                            <button onClick={() => setSearchStock('')} className="absolute right-3.5 top-3 text-slate-400 text-xs hover:text-slate-600 font-bold">✕</button>
                          )}
                        </div>

                        {/* ปุ่ม Filter หมวดหมู่ */}
                        <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
                          <button
                            onClick={() => setSelectedCategory('all')}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                              selectedCategory === 'all'
                                ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20'
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                          >
                            ทั้งหมด
                          </button>
                          {availableCategories.map((cat, idx) => (
                            <button
                              key={idx}
                              onClick={() => setSelectedCategory(cat)}
                              className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                                selectedCategory === cat
                                  ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20'
                                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                              }`}
                            >
                              {cat}
                            </button>
                          ))}
                        </div>
                      </div>

                      {filteredStocks.length === 0 ? (
                        <div className="text-center py-16 text-slate-400 text-sm font-medium">ไม่พบวัตถุดิบที่ตรงกับการค้นหา</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                          {filteredStocks.map(item => {
                            const currentVal = Number(item.current) || 0;
                            const minVal = Number(item.minAlert) || 0;
                            const isLow = currentVal <= minVal;

                            return (
                              <div key={item.id} className="border border-slate-200 rounded-2xl p-4 sm:p-5 bg-white shadow-sm flex flex-col justify-between hover:shadow-md transition">
                                <div>
                                  <div className="flex justify-between items-start mb-3">
                                    <div className="flex items-center space-x-3">
                                      <img src={item.image || DEFAULT_IMAGE} className="w-12 h-12 rounded-xl object-cover border border-slate-200" alt={item.name} />
                                      <div>
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">{item.category || 'ทั่วไป'}</span>
                                        <h3 className="font-bold text-sm sm:text-base text-slate-800 mt-0.5">{item.name}</h3>
                                        {item.barcode && <p className="text-[10px] text-slate-400">Barcode: {item.barcode}</p>}
                                      </div>
                                    </div>
                                    <div className="flex space-x-1">
